<script>
// ═══════════════════════════════════════════════
// 配置
// ═══════════════════════════════════════════════
const WORKER_URL = "https://trading-proxy.jimwayi.workers.dev";
const MARKET_SYMBOL = "SPY";
const FIXED_PARAMS = {
  STAGE_BREAKEVEN_PCT: 0.3,
  STAGE_LOCK_05_PCT: 0.8,
  STAGE_LOCK_1_PCT: 1.5,
  TRAILING_STOP_PCT: 0.006,
  BULL_ATR_MULT: 1.5, BULL_MIN_STOP: 1.5, BULL_MAX_STOP: 3.0,
  BEAR_ATR_MULT: 1.0, BEAR_MIN_STOP: 0.8, BEAR_MAX_STOP: 1.5,
  NEWS_EXIT_MAX_PNL: 1.0,
  TIME_STOP_MAX_PNL: 0,
  COMPOSITE_HIGH: 0.8,
  MA_WINDOW: 30,
  SLIP_LOW_MAP: { NVDA: 1, META: 1 },
  NEWS_BULLISH_PROB: 0.25,
  NEWS_BEARISH_PROB: 0.10
};

// ═══════════════════════════════════════════════
// 工具
// ═══════════════════════════════════════════════
function getSelectedSymbols() {
  return Array.from(document.querySelectorAll('#symbolsGroup input:checked')).map(c => c.value);
}
function setSelectedSymbols(symbols) {
  document.querySelectorAll('#symbolsGroup input').forEach(c => {
    c.checked = symbols.includes(c.value);
  });
}
function fmtMoney(v) { return (v >= 0 ? '+' : '') + '$' + v.toFixed(2); }
function fmtPct(v, digits = 2) { return (v >= 0 ? '+' : '') + v.toFixed(digits) + '%'; }
function toEtTimeStr(msTimestamp) {
  return new Date(msTimestamp).toLocaleString('zh-CN', {
    hour12: false, timeZone: 'America/New_York',
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
  });
}
function getEasternMinutes(msTimestamp) {
  const et = new Date(new Date(msTimestamp).toLocaleString("en-US", { timeZone: "America/New_York" }));
  return et.getHours() * 60 + et.getMinutes();
}
function getEasternDateStr(msTimestamp) {
  const et = new Date(new Date(msTimestamp).toLocaleString("en-US", { timeZone: "America/New_York" }));
  return `${et.getFullYear()}-${String(et.getMonth()+1).padStart(2,'0')}-${String(et.getDate()).padStart(2,'0')}`;
}
function isMarketOpen(msTimestamp) {
  const m = getEasternMinutes(msTimestamp);
  return m >= 570 && m < 960;
}
function isBarCloseTime(msTimestamp, tf) {
  return getEasternMinutes(msTimestamp) % tf === 0;
}
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// ═══════════════════════════════════════════════

function logPreset(msg) {

document.getElementById('btnRun').addEventListener('click', runFullBacktest);

// ═══════════════════════════════════════════════
// 数据拉取
// ═══════════════════════════════════════════════
async function fetchAllBars(symbol, tf, startISO, endISO, onProgress) {
  const tfMap = { 1: '1Min', 5: '5Min' };
  const allBars = [];
  let pageToken = null;
  let page = 0;
  const maxPages = 20;

  while (page < maxPages) {
    let url = `${WORKER_URL}/alpaca-data/v2/stocks/${symbol}/bars?timeframe=${tfMap[tf]}&start=${startISO}&end=${endISO}&limit=10000&feed=iex&sort=asc&adjustment=raw`;
    if (pageToken) url += `&page_token=${encodeURIComponent(pageToken)}`;

    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`${symbol} K线 HTTP ${resp.status}`);
    const json = await resp.json();
    const bars = json.bars || [];
    for (const b of bars) {
      allBars.push({
        time: new Date(b.t).getTime(),
        open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v
      });
    }
    if (onProgress) onProgress(page + 1, bars.length);
    if (!json.next_page_token) break;
    pageToken = json.next_page_token;
    page++;
    await new Promise(r => setTimeout(r, 200));
  }
  return allBars;
}

// ═══════════════════════════════════════════════
// 回测核心
// ═══════════════════════════════════════════════
function backtest(dataMap, marketBars, params) {
  const symbols = Object.keys(dataMap).filter(s => dataMap[s] && dataMap[s].length > 0);
  if (symbols.length === 0) return null;

  const rng = makeRng(params.seed);

  // 预计算 ATR / 均量 / 趋势
  const atrCache = {}, volMaCache = {}, trendCache = {};
  for (const sym of symbols) {
    const bars = dataMap[sym];
    atrCache[sym] = bars.map((_, i) => {
      if (i < 19) return null;
      let s = 0;
      for (let j = i - 19; j <= i; j++) s += ((bars[j].high - bars[j].low) / bars[j].close) * 100;
      return s / 20;
    });
    volMaCache[sym] = bars.map((_, i) => {
      if (i < 19) return null;
      let s = 0;
      for (let j = i - 19; j <= i; j++) s += bars[j].volume;
      return s / 20;
    });
    const needTrend = Math.ceil(15 / params.tf);
    trendCache[sym] = bars.map((_, i) => {
      if (i < needTrend) return false;
      const recent = bars.slice(i - needTrend + 1, i + 1);
      if (recent[recent.length - 1].close <= recent[0].open) return false;
      let up = 0;
      for (let k = 1; k < recent.length; k++) if (recent[k].close > recent[k-1].close) up++;
      return up >= Math.ceil(needTrend / 2);
    });
  }

  let marketState = { isBull: false, loaded: false, lastUpdate: 0 };
  function computeMarketStateAtTime(msTs) {
    if (!marketBars || marketBars.length === 0) return { isBull: false, loaded: true };
    let idx = -1;
    for (let i = marketBars.length - 1; i >= 0; i--) {
      if (marketBars[i].time <= msTs) { idx = i; break; }
    }
    if (idx < FIXED_PARAMS.MA_WINDOW * 2) return { isBull: false, loaded: true };
    const recent = marketBars.slice(idx - FIXED_PARAMS.MA_WINDOW + 1, idx + 1);
    const prev = marketBars.slice(idx - FIXED_PARAMS.MA_WINDOW * 2 + 1, idx - FIXED_PARAMS.MA_WINDOW + 1);
    const rAvg = recent.reduce((s, b) => s + b.close, 0) / recent.length;
    const pAvg = prev.reduce((s, b) => s + b.close, 0) / prev.length;
    return { isBull: rAvg > pAvg, loaded: true };
  }

  let cash = params.capital;
  const positions = [];
  const trades = [];
  const equityCurve = [];
  const dailyTradeCount = {};
  const dailySymbolRealizedPnl = {};
  let dailyAccountRealizedPnl = 0;
  let circuitBroken = false;
  let currentDate = null;
  let maxEquity = params.capital;
  let maxDrawdown = 0;
  const dailyEquity = {};

  const allEvents = [];
  for (const sym of symbols) {
    dataMap[sym].forEach((bar, idx) => allEvents.push({ symbol: sym, idx, ...bar }));
  }
  allEvents.sort((a, b) => a.time - b.time || a.symbol.localeCompare(b.symbol));

  const currentIdx = {};
  for (const sym of symbols) currentIdx[sym] = -1;

  let lastEvaluatedTime = -1;

  for (let ei = 0; ei < allEvents.length; ei++) {
    const evt = allEvents[ei];
    const sym = evt.symbol;
    currentIdx[sym] = evt.idx;
    const msTs = evt.time;
    const etDateStr = getEasternDateStr(msTs);

    if (etDateStr !== currentDate) {
      if (currentDate) {
        const posValue = positions.reduce((s, p) => {
          const bars = dataMap[p.symbol];
          const idx = currentIdx[p.symbol];
          if (idx >= 0 && bars[idx]) return s + p.qty * bars[idx].close;
          return s + p.qty * p.entryPrice;
        }, 0);
        dailyEquity[currentDate] = cash + posValue;
      }
      currentDate = etDateStr;
      for (const k in dailyTradeCount) delete dailyTradeCount[k];
      for (const k in dailySymbolRealizedPnl) delete dailySymbolRealizedPnl[k];
      dailyAccountRealizedPnl = 0;
      circuitBroken = false;
    }

    if (msTs - marketState.lastUpdate >= 30 * 60 * 1000) {
      marketState = computeMarketStateAtTime(msTs);
      marketState.lastUpdate = msTs;
    }

    // ── 持仓出场检查 ──
    for (let pi = positions.length - 1; pi >= 0; pi--) {
      const pos = positions[pi];
      if (pos.symbol !== sym) continue;

      const bar = evt;
      const price = bar.close;
      const pnlPct = ((price - pos.entryPrice) / pos.entryPrice) * 100;

      if (bar.high > pos.highPrice) pos.highPrice = bar.high;
      const highPrice = pos.highPrice;

      let closed = false;

      // 1) 部分止盈
      if (!pos.partialTP && pnlPct >= params.partialTP) {
        const halfQty = pos.qty / 2;
        const slip = getSlippage(sym, params);
        const sellPrice = price * (1 - slip);
        cash += halfQty * sellPrice;
        const realizedPnl = halfQty * (sellPrice - pos.entryPrice);
        const realizedCost = halfQty * pos.entryPrice;
        pos.qty -= halfQty;
        pos.partialTP = true;
        trades.push({
          symbol: sym, qty: halfQty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
          entryTime: pos.entryTime, exitTime: msTs, pnl: realizedPnl,
          pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
          reason: '部分止盈', entryAtrPct: pos.atrPct
        });
      }

      // 2) 部分止盈后的剩余仓位：固定止盈或跟踪止盈
      if (pos.partialTP && pos.qty > 0.0001) {
        let exit = false;
        let exitLabel = null;

        // 优先检查固定止盈（如果设置了 fixedTP > 0）
        if (params.fixedTP > 0 && pnlPct >= params.fixedTP) {
          exit = true;
          exitLabel = '固定止盈';
        }
        // 否则检查跟踪止盈（如果 trailRetreat > 0）
        else if (params.trailRetreat > 0) {
          const trailPrice = highPrice * (1 - params.trailRetreat / 100);
          if (price <= trailPrice) {
            exit = true;
            exitLabel = '跟踪止盈';
          }
        }

        if (exit) {
          const slip = getSlippage(sym, params);
          const sellPrice = price * (1 - slip);
          cash += pos.qty * sellPrice;
          const realizedPnl = pos.qty * (sellPrice - pos.entryPrice);
          const realizedCost = pos.qty * pos.entryPrice;
          trades.push({
            symbol: sym, qty: pos.qty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
            entryTime: pos.entryTime, exitTime: msTs, pnl: realizedPnl,
            pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
            reason: exitLabel, entryAtrPct: pos.atrPct
          });
          dailyAccountRealizedPnl += (realizedPnl / params.capital) * 100;
          dailyTradeCount[sym] = (dailyTradeCount[sym] || 0) + 1;
          positions.splice(pi, 1);
          closed = true;
          continue;
        }
      }

      // 3) 分级止损（未部分止盈）
      if (!pos.partialTP && !closed) {
        const stopInfo = getEffectiveStopPrice(pos.entryPrice, price, highPrice, pos.entryStopLossPct, pnlPct);
        if (price <= stopInfo.price) {
          const slip = getSlippage(sym, params);
          const sellPrice = price * (1 - slip);
          cash += pos.qty * sellPrice;
          const realizedPnl = pos.qty * (sellPrice - pos.entryPrice);
          const realizedCost = pos.qty * pos.entryPrice;
          trades.push({
            symbol: sym, qty: pos.qty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
            entryTime: pos.entryTime, exitTime: msTs, pnl: realizedPnl,
            pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
            reason: stopInfo.stage, entryAtrPct: pos.atrPct
          });
          dailyAccountRealizedPnl += (realizedPnl / params.capital) * 100;
          dailyTradeCount[sym] = (dailyTradeCount[sym] || 0) + 1;
          positions.splice(pi, 1);
          closed = true;
          continue;
        }
      }

      // 4) 时间止损
      if (!closed) {
        const holdMin = (msTs - pos.entryTime) / 60000;
        if (holdMin >= params.timeStop && pnlPct < FIXED_PARAMS.TIME_STOP_MAX_PNL) {
          const slip = getSlippage(sym, params);
          const sellPrice = price * (1 - slip);
          cash += pos.qty * sellPrice;
          const realizedPnl = pos.qty * (sellPrice - pos.entryPrice);
          const realizedCost = pos.qty * pos.entryPrice;
          trades.push({
            symbol: sym, qty: pos.qty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
            entryTime: pos.entryTime, exitTime: msTs, pnl: realizedPnl,
            pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
            reason: '时间止损', entryAtrPct: pos.atrPct
          });
          dailyAccountRealizedPnl += (realizedPnl / params.capital) * 100;
          dailyTradeCount[sym] = (dailyTradeCount[sym] || 0) + 1;
          positions.splice(pi, 1);
          closed = true;
          continue;
        }
      }

      // 5) 加仓
      if (!closed && !pos.added && pnlPct >= params.addTrigger) {
        const currentPosValue = pos.qty * price;
        const totalEquityNow = cash + currentPosValue;
        const currentExposurePct = (currentPosValue / totalEquityNow) * 100;
        if (currentExposurePct < params.maxExposure) {
          const addValue = totalEquityNow * (params.addSize / 100);
          const newExposurePct = ((currentPosValue + addValue) / totalEquityNow) * 100;
          if (newExposurePct <= params.maxExposure && cash >= addValue) {
            const slip = getSlippage(sym, params);
            const buyPrice = price * (1 + slip);
            const addQty = addValue / buyPrice;
            cash -= addValue;
            const totalQty = pos.qty + addQty;
            pos.entryPrice = (pos.qty * pos.entryPrice + addQty * buyPrice) / totalQty;
            pos.qty = totalQty;
            pos.added = true;
            pos.highPrice = price;
          }
        }
      }
    }

    // 记录权益曲线
    if (ei === 0 || allEvents[ei - 1].time !== msTs) {
      const posValue = positions.reduce((s, p) => {
        const bars = dataMap[p.symbol];
        const idx = currentIdx[p.symbol];
        if (idx >= 0 && bars[idx]) return s + p.qty * bars[idx].close;
        return s + p.qty * p.entryPrice;
      }, 0);
      const equity = cash + posValue;
      equityCurve.push({ time: Math.floor(msTs / 1000), value: equity });
      if (equity > maxEquity) maxEquity = equity;
      const dd = ((maxEquity - equity) / maxEquity) * 100;
      if (dd > maxDrawdown) maxDrawdown = dd;
    }

    // ── 入场评估 ──
    if (msTs === lastEvaluatedTime) continue;
    lastEvaluatedTime = msTs;

    if (!isBarCloseTime(msTs, params.tf)) continue;
    if (!isMarketOpen(msTs)) continue;
    if (circuitBroken) continue;
    if (positions.length >= params.maxPositions) continue;

    const posValue = positions.reduce((s, p) => {
      const bars = dataMap[p.symbol];
      const idx = currentIdx[p.symbol];
      if (idx >= 0 && bars[idx]) return s + p.qty * bars[idx].close;
      return s + p.qty * p.entryPrice;
    }, 0);
    const totalEquityNow = cash + posValue;
    const totalExposurePct = (posValue / totalEquityNow) * 100;
    if (totalExposurePct >= params.maxTotal) continue;

    const m = getEasternMinutes(msTs);
    if (m >= params.forceClose && positions.length > 0) {
      for (let pi = positions.length - 1; pi >= 0; pi--) {
        const pos = positions[pi];
        const bars = dataMap[pos.symbol];
        const idx = currentIdx[pos.symbol];
        if (idx < 0 || !bars[idx]) continue;
        const price = bars[idx].close;
        const slip = getSlippage(pos.symbol, params);
        const sellPrice = price * (1 - slip);
        cash += pos.qty * sellPrice;
        const realizedPnl = pos.qty * (sellPrice - pos.entryPrice);
        const realizedCost = pos.qty * pos.entryPrice;
        trades.push({
          symbol: pos.symbol, qty: pos.qty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
          entryTime: pos.entryTime, exitTime: msTs, pnl: realizedPnl,
          pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
          reason: '收盘强平', entryAtrPct: pos.atrPct
        });
        dailyAccountRealizedPnl += (realizedPnl / params.capital) * 100;
        dailyTradeCount[pos.symbol] = (dailyTradeCount[pos.symbol] || 0) + 1;
        positions.splice(pi, 1);
      }
      continue;
    }

    const heldSymbols = new Set(positions.map(p => p.symbol));
    const candidates = [];

    for (const s of symbols) {
      if (heldSymbols.has(s)) continue;

      const maxTrades = getMaxDailyTrades(dailySymbolRealizedPnl[s] || 0);
      if ((dailyTradeCount[s] || 0) >= maxTrades) continue;

      const idx = currentIdx[s];
      if (idx < 25) continue;
      const bars = dataMap[s];
      const bar = bars[idx];

      const barRange = ((bar.high - bar.low) / bar.close) * 100;
      if (barRange > 1.0) continue;

      const atrPct = atrCache[s][idx];
      if (atrPct === null || atrPct > params.atrThreshold) continue;

      const pastPrice = bars[idx - 3].close;
      const momentumPct = ((bar.close - pastPrice) / pastPrice) * 100;
      if (momentumPct < params.momentum) continue;

      if (!trendCache[s][idx]) continue;

      const newsScore = simulateNews(s, msTs, rng, params);
      if (!newsScore.bullish) continue;

      const momentumScore = Math.min(momentumPct / 5, 1);
      const composite = newsScore.score * 0.6 + momentumScore * 0.4;
      candidates.push({ symbol: s, price: bar.close, composite, atrPct, momentumPct });
    }

    if (candidates.length === 0) continue;
    candidates.sort((a, b) => b.composite - a.composite);

    let opened = 0;
    const remainingSlots = params.maxPositions - positions.length;

    for (const c of candidates) {
      if (opened >= remainingSlots) break;

      const positionValue = totalEquityNow * (params.baseSize / 100);
      if ((posValue + positionValue) / totalEquityNow * 100 > params.maxTotal) continue;

      const slip = getSlippage(c.symbol, params);
      const buyPrice = c.price * (1 + slip);
      const qty = positionValue / buyPrice;

      const isBull = marketState.isBull;
      const mult = isBull ? FIXED_PARAMS.BULL_ATR_MULT : FIXED_PARAMS.BEAR_ATR_MULT;
      const minStop = isBull ? FIXED_PARAMS.BULL_MIN_STOP : FIXED_PARAMS.BEAR_MIN_STOP;
      const maxStop = isBull ? FIXED_PARAMS.BULL_MAX_STOP : FIXED_PARAMS.BEAR_MAX_STOP;
      const dynStop = Math.max(minStop, Math.min(maxStop, c.atrPct * mult));

      cash -= qty * buyPrice;
      positions.push({
        symbol: c.symbol, qty, entryPrice: buyPrice, entryTime: msTs,
        entryIdx: currentIdx[c.symbol], highPrice: c.price, atrPct: c.atrPct,
        entryStopLossPct: dynStop, partialTP: false, added: false
      });
      opened++;
    }

    if (!circuitBroken && dailyAccountRealizedPnl <= -params.circuit) {
      circuitBroken = true;
    }
  }

  // 期末平仓
  for (const pos of positions) {
    const bars = dataMap[pos.symbol];
    const lastBar = bars[bars.length - 1];
    const slip = getSlippage(pos.symbol, params);
    const sellPrice = lastBar.close * (1 - slip);
    cash += pos.qty * sellPrice;
    const realizedPnl = pos.qty * (sellPrice - pos.entryPrice);
    const realizedCost = pos.qty * pos.entryPrice;
    trades.push({
      symbol: pos.symbol, qty: pos.qty, entryPrice: pos.entryPrice, exitPrice: sellPrice,
      entryTime: pos.entryTime, exitTime: lastBar.time, pnl: realizedPnl,
      pnlPct: realizedCost > 0 ? (realizedPnl / realizedCost) * 100 : 0,
      reason: '期末平仓', entryAtrPct: pos.atrPct
    });
  }

  const finalEquity = cash;
  const stats = computeStats(trades, equityCurve, params.capital, finalEquity, dailyEquity, maxDrawdown, params);
  return { trades, equityCurve, stats };
}

function getSlippage(symbol, params) {
  if (FIXED_PARAMS.SLIP_LOW_MAP[symbol]) return params.slipLow / 100;
  return params.slipHigh / 100;
}

function getEffectiveStopPrice(entryPrice, currentPrice, highPrice, stopLossPct, pnlPct) {
  if (pnlPct < FIXED_PARAMS.STAGE_BREAKEVEN_PCT) return { price: entryPrice * (1 - stopLossPct / 100), stage: '成本止损' };
  if (pnlPct < FIXED_PARAMS.STAGE_LOCK_05_PCT) return { price: entryPrice, stage: '保本' };
  if (pnlPct < FIXED_PARAMS.STAGE_LOCK_1_PCT) return { price: entryPrice * 1.005, stage: '锁定+0.5%' };
  return { price: Math.max(entryPrice * 1.01, highPrice * (1 - FIXED_PARAMS.TRAILING_STOP_PCT)), stage: '锁定+1%+跟踪' };
}

function getMaxDailyTrades(pnlPct) {
  if (pnlPct < -1) return 0;
  if (pnlPct < 0) return 1;
  if (pnlPct <= 1) return 3;
  return 5;
}

function simulateNews(symbol, msTs, rng, params) {
  const windowKey = Math.floor(msTs / (15 * 60 * 1000));
  const hashSeed = hashStr(symbol + '_' + windowKey);
  const r = makeRng(hashSeed + params.seed)();
  if (r < FIXED_PARAMS.NEWS_BULLISH_PROB) {
    return { bullish: true, score: 0.5 + rng() * 0.4 };
  } else if (r < FIXED_PARAMS.NEWS_BULLISH_PROB + FIXED_PARAMS.NEWS_BEARISH_PROB) {
    return { bullish: false, score: 0.1 + rng() * 0.2 };
  } else {
    return { bullish: false, score: 0.2 + rng() * 0.2 };
  }
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

// ═══════════════════════════════════════════════
// 绩效计算
// ═══════════════════════════════════════════════
function computeStats(trades, equityCurve, initialCapital, finalEquity, dailyEquity, maxDrawdown, params) {
  const totalReturnPct = ((finalEquity - initialCapital) / initialCapital) * 100;
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const totalWin = wins.reduce((s, t) => s + t.pnl, 0);
  const totalLoss = losses.reduce((s, t) => s + t.pnl, 0);
  const winRate = trades.length > 0 ? (wins.length / trades.length) * 100 : 0;
  const avgWin = wins.length > 0 ? totalWin / wins.length : 0;
  const avgLoss = losses.length > 0 ? totalLoss / losses.length : 0;
  const profitFactor = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0;
  const avgPnl = trades.length > 0 ? trades.reduce((s, t) => s + t.pnl, 0) / trades.length : 0;

  const dates = Object.keys(dailyEquity).sort();
  const tradingDays = dates.length > 0 ? dates.length : Math.max(1, equityCurve.length / 78);
  const years = tradingDays / 252;
  const annualizedReturnPct = years > 0 ? (Math.pow(finalEquity / initialCapital, 1 / years) - 1) * 100 : 0;

  const dailyReturns = [];
  let prevEquity = initialCapital;
  for (const d of dates) {
    const eq = dailyEquity[d];
    dailyReturns.push((eq - prevEquity) / prevEquity);
    prevEquity = eq;
  }
  let sharpe = 0;
  if (dailyReturns.length > 1) {
    const mean = dailyReturns.reduce((s, r) => s + r, 0) / dailyReturns.length;
    const variance = dailyReturns.reduce((s, r) => s + (r - mean) ** 2, 0) / (dailyReturns.length - 1);
    const sd = Math.sqrt(variance);
    if (sd > 0) sharpe = (mean / sd) * Math.sqrt(252);
  }

  const calmar = maxDrawdown > 0 ? annualizedReturnPct / maxDrawdown : 0;

  const byReason = {};
  trades.forEach(t => {
    if (!byReason[t.reason]) byReason[t.reason] = { count: 0, pnl: 0, wins: 0 };
    byReason[t.reason].count++;
    byReason[t.reason].pnl += t.pnl;
    if (t.pnl > 0) byReason[t.reason].wins++;
  });

  const bySymbol = {};
  trades.forEach(t => {
    if (!bySymbol[t.symbol]) bySymbol[t.symbol] = { count: 0, pnl: 0, wins: 0 };
    bySymbol[t.symbol].count++;
    bySymbol[t.symbol].pnl += t.pnl;
    if (t.pnl > 0) bySymbol[t.symbol].wins++;
  });

  const avgHoldMin = trades.length > 0
    ? trades.reduce((s, t) => s + (t.exitTime - t.entryTime) / 60000, 0) / trades.length
    : 0;

  return {
    finalEquity, totalReturnPct, annualizedReturnPct, maxDrawdown,
    winRate, profitFactor, avgWin, avgLoss, avgPnl, sharpe, calmar,
    totalTrades: trades.length, wins: wins.length, losses: losses.length,
    avgHoldMin, tradingDays, byReason, bySymbol
  };
}

// ═══════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════
async function runFullBacktest() {
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  const symbols = getSelectedSymbols();
  if (!startDate || !endDate) { alert('请选择日期'); return; }
  if (symbols.length === 0) { alert('请选择至少一只股票'); return; }

  const params = {
    capital: parseFloat(document.getElementById('p_capital').value),
    baseSize: parseFloat(document.getElementById('p_baseSize').value),
    partialTP: parseFloat(document.getElementById('p_partialTP').value),
    trailRetreat: parseFloat(document.getElementById('p_trailRetreat').value),
    fixedTP: parseFloat(document.getElementById('p_fixedTP').value),
    addTrigger: parseFloat(document.getElementById('p_addTrigger').value),
    addSize: parseFloat(document.getElementById('p_addSize').value),
    maxExposure: parseFloat(document.getElementById('p_maxExposure').value),
    maxTotal: parseFloat(document.getElementById('p_maxTotal').value),
    maxPositions: parseInt(document.getElementById('p_maxPositions').value),
    momentum: parseFloat(document.getElementById('p_momentum').value),
    atrThreshold: parseFloat(document.getElementById('p_atrThreshold').value),
    timeStop: parseInt(document.getElementById('p_timeStop').value),
    circuit: parseFloat(document.getElementById('p_circuit').value),
    forceClose: parseInt(document.getElementById('p_forceClose').value),
    tf: parseInt(document.getElementById('p_tf').value),
    slipLow: parseFloat(document.getElementById('p_slipLow').value),
    slipHigh: parseFloat(document.getElementById('p_slipHigh').value),
    seed: parseInt(document.getElementById('p_seed').value)
  };

  document.getElementById('btnRun').disabled = true;
  const progress = document.getElementById('progress');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');
  progress.style.display = 'block';
  document.getElementById('resultArea').innerHTML = '';

  try {
    const startISO = new Date(startDate + 'T00:00:00Z').toISOString();
    const endISO = new Date(new Date(endDate).getTime() + 24*3600*1000).toISOString();

    const dataMap = {};
    const totalTasks = symbols.length + 1;
    let done = 0;

    for (const sym of symbols) {
      progressText.textContent = `拉取 ${sym} 历史 K 线...`;
      progressFill.style.width = `${(done / totalTasks) * 100}%`;
      dataMap[sym] = await fetchAllBars(sym, params.tf, startISO, endISO, (p, c) => {
        progressText.textContent = `拉取 ${sym} 第 ${p} 页（${c} 根）...`;
      });
      done++;
    }

    progressText.textContent = `拉取 ${MARKET_SYMBOL} 市场参考数据...`;
    progressFill.style.width = `${(done / totalTasks) * 100}%`;
    const marketBars = await fetchAllBars(MARKET_SYMBOL, params.tf, startISO, endISO);
    done++;

    progressText.textContent = '运行回测...';
    progressFill.style.width = '80%';
    await new Promise(r => setTimeout(r, 100));

    const result = backtest(dataMap, marketBars, params);

    progressFill.style.width = '100%';
    progressText.textContent = '完成';

    if (!result || result.trades.length === 0) {
      document.getElementById('resultArea').innerHTML = '<div class="error">回测期间无交易产生，或数据不足。请检查日期范围与标的。</div>';
      return;
    }

    renderResult(result, params, symbols, dataMap);

  } catch (e) {
    console.error(e);
    document.getElementById('resultArea').innerHTML = `<div class="error">回测错误：${e.message}</div>`;
  } finally {
    document.getElementById('btnRun').disabled = false;
    setTimeout(() => { progress.style.display = 'none'; }, 1500);
  }
}

// ═══════════════════════════════════════════════
// 渲染
// ═══════════════════════════════════════════════

  const s = result.stats;
  const area = document.getElementById('resultArea');
  const cls = v => v >= 0 ? 'profit' : 'loss';

  let html = '';

  html += `<h2>📈 整体绩效</h2>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-label">最终权益</div><div class="stat-value">${'$' + s.finalEquity.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">总收益率</div><div class="stat-value ${cls(s.totalReturnPct)}">${fmtPct(s.totalReturnPct)}</div></div>
    <div class="stat-card"><div class="stat-label">年化收益率</div><div class="stat-value ${cls(s.annualizedReturnPct)}">${fmtPct(s.annualizedReturnPct)}</div></div>
    <div class="stat-card"><div class="stat-label">最大回撤</div><div class="stat-value loss">${s.maxDrawdown.toFixed(2)}%</div></div>
    <div class="stat-card"><div class="stat-label">夏普比率</div><div class="stat-value ${s.sharpe >= 1 ? 'profit' : s.sharpe >= 0 ? 'warn' : 'loss'}">${s.sharpe.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">卡玛比率</div><div class="stat-value ${s.calmar >= 1 ? 'profit' : s.calmar >= 0 ? 'warn' : 'loss'}">${s.calmar.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">交易次数</div><div class="stat-value">${s.totalTrades}</div></div>
    <div class="stat-card"><div class="stat-label">胜率</div><div class="stat-value ${s.winRate >= 50 ? 'profit' : 'loss'}">${s.winRate.toFixed(1)}%</div></div>
    <div class="stat-card"><div class="stat-label">盈亏比</div><div class="stat-value ${s.profitFactor >= 1 ? 'profit' : 'loss'}">${s.profitFactor.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">平均盈利</div><div class="stat-value profit">${fmtMoney(s.avgWin)}</div></div>
    <div class="stat-card"><div class="stat-label">平均亏损</div><div class="stat-value loss">${fmtMoney(s.avgLoss)}</div></div>
    <div class="stat-card"><div class="stat-label">平均持仓</div><div class="stat-value">${s.avgHoldMin.toFixed(0)} 分钟</div></div>
  </div>`;

  // 当前配置摘要
  const cfgLines = [];
  cfgLines.push(`标的：${symbols.join('、')}`);
  cfgLines.push(`部分止盈：${params.partialTP}%`);
  if (params.fixedTP > 0) cfgLines.push(`固定止盈：${params.fixedTP}%（已禁用跟踪）`);
  if (params.trailRetreat > 0) cfgLines.push(`跟踪回撤：${params.trailRetreat}%`);
  cfgLines.push(`加仓触发：${params.addTrigger}% / 加仓比例 ${params.addSize}%`);
  cfgLines.push(`最大持仓：${params.maxPositions} 只 / 单只上限 ${params.maxExposure}% / 总敞口 ${params.maxTotal}%`);
  cfgLines.push(`动量阈值：${params.momentum}% / ATR 阈值 ${params.atrThreshold}%`);
  cfgLines.push(`时间止损：${params.timeStop} 分钟 / 熔断 ${params.circuit}%`);
  cfgLines.push(`种子：${params.seed}`);
  html += `<div class="hint" style="margin-top:10px; padding:8px; background:#0d1117; border:1px solid #30363d; border-radius:6px;">
    <strong>当前配置：</strong>${cfgLines.join(' | ')}
  </div>`;

  html += `<h2>📉 权益曲线与价格</h2>`;
  html += `<div class="chart-wrap"><div id="equityChart"></div><div id="priceChart"></div></div>`;

  html += `<h2>📊 按标的统计</h2><table>
    <thead><tr><th>标的</th><th>交易次数</th><th>胜率</th><th>总盈亏</th></tr></thead><tbody>`;
  Object.entries(s.bySymbol).sort((a, b) => b[1].pnl - a[1].pnl).forEach(([sym, d]) => {
    html += `<tr>
      <td><strong>${sym}</strong></td>
      <td>${d.count}</td>
      <td class="${d.wins / d.count >= 0.5 ? 'profit' : 'loss'}">${((d.wins / d.count) * 100).toFixed(1)}%</td>
      <td class="${cls(d.pnl)}">${fmtMoney(d.pnl)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  html += `<h2>🚪 按出场原因统计</h2><table>
    <thead><tr><th>原因</th><th>次数</th><th>胜率</th><th>总盈亏</th></tr></thead><tbody>`;
  Object.entries(s.byReason).sort((a, b) => b[1].count - a[1].count).forEach(([r, d]) => {
    const tagCls = r.includes('止损') ? 'tag-stop' : r.includes('跟踪') ? 'tag-trail' : r.includes('部分') || r.includes('固定') ? 'tag-tp' : r.includes('时间') ? 'tag-time' : r.includes('新闻') || r.includes('反向') ? 'tag-news' : 'tag-eod';
    html += `<tr>
      <td><span class="tag ${tagCls}">${r}</span></td>
      <td>${d.count}</td>
      <td class="${d.wins / d.count >= 0.5 ? 'profit' : 'loss'}">${((d.wins / d.count) * 100).toFixed(1)}%</td>
      <td class="${cls(d.pnl)}">${fmtMoney(d.pnl)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  html += `<h2>📋 交易明细（最近 50 笔）</h2><table>
    <thead><tr><th>入场时间</th><th>出场时间</th><th>标的</th><th>股数</th><th>入场价</th><th>出场价</th><th>盈亏</th><th>盈亏%</th><th>出场原因</th></tr></thead><tbody>`;
  const recent = result.trades.slice(-50).reverse();
  recent.forEach(t => {
    const reasonCls = t.reason.includes('止损') ? 'tag-stop' : t.reason.includes('跟踪') ? 'tag-trail' : t.reason.includes('部分') || t.reason.includes('固定') ? 'tag-tp' : t.reason.includes('时间') ? 'tag-time' : 'tag-eod';
    html += `<tr>
      <td>${toEtTimeStr(t.entryTime)}</td>
      <td>${toEtTimeStr(t.exitTime)}</td>
      <td><strong>${t.symbol}</strong></td>
      <td>${t.qty.toFixed(4)}</td>
      <td>$${t.entryPrice.toFixed(2)}</td>
      <td>$${t.exitPrice.toFixed(2)}</td>
      <td class="${cls(t.pnl)}">${fmtMoney(t.pnl)}</td>
      <td class="${cls(t.pnlPct)}">${fmtPct(t.pnlPct)}</td>
      <td><span class="tag ${reasonCls}">${t.reason}</span></td>
    </tr>`;
  });
  html += `</tbody></table>`;

  html += `<div class="hint">
    <strong>说明：</strong><br>
    1. 新闻情绪用随机模拟（25% 看涨概率 + 10% 看跌概率），不反映真实新闻。<br>
    2. 权益曲线为事件时间点上的账户总权益（现金 + 持仓市值）。<br>
    3. 夏普比率基于日收益序列计算，年化乘以 √252。<br>
    4. 回测剔除了盘后入场，允许盘后出场，与实盘一致。<br>
    5. 数据来源：Alpaca IEX，可能存在个别缺失时段。<br>
    6. 固定止盈 > 0 时，部分止盈后的剩余仓位用固定止盈；跟踪回撤 = 0 时禁用跟踪止盈。
  </div>`;

  area.innerHTML = html;
  requestAnimationFrame(() => renderCharts(result, symbols, dataMap));
}

function renderCharts(result, symbols, dataMap) {
  const eqEl = document.getElementById('equityChart');
  if (!eqEl) return;
  const eqChart = LightweightCharts.createChart(eqEl, {
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    timeScale: { timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: '#30363d' },
  });
  const eqSeries = eqChart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });
  eqSeries.setData(result.equityCurve.map(p => ({ time: p.time, value: p.value })));
  eqChart.timeScale().fitContent();

  const markers = [];
  for (const t of result.trades) {
    if (t.reason === '部分止盈') continue;
    markers.push({
      time: Math.floor(t.exitTime / 1000),
      position: 'aboveBar', color: '#f85149', shape: 'arrowDown', text: t.symbol + ' 出场'
    });
  }
  eqSeries.setMarkers(markers);

  const ro = new ResizeObserver(() => {
    eqChart.applyOptions({ width: eqEl.clientWidth, height: eqEl.clientHeight });
  });
  ro.observe(eqEl);

  const prEl = document.getElementById('priceChart');
  if (!prEl) return;
  const prChart = LightweightCharts.createChart(prEl, {
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    timeScale: { timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: '#30363d' },
  });
  const prSeries = prChart.addLineSeries({ color: '#d29922', lineWidth: 1 });
  const firstSym = symbols[0];
  const firstBars = dataMap[firstSym];
  prSeries.setData(firstBars.map(b => ({ time: Math.floor(b.time / 1000), value: b.close })));
  prChart.timeScale().fitContent();

  const ro2 = new ResizeObserver(() => {
    prChart.applyOptions({ width: prEl.clientWidth, height: prEl.clientHeight });
  });
  ro2.observe(prEl);
}
</script>
</body>
</html>
