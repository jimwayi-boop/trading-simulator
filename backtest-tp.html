<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>股票自动交易策略A-止盈回测工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; padding: 16px; font-size: 14px; }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  h2 { font-size: 14px; margin: 20px 0 8px 0; color: #58a6ff; text-transform: uppercase; letter-spacing: .5px; }
  .desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; line-height: 1.6; }

  .controls { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .controls label { font-size: 12px; color: #8b949e; }
  .controls input[type="date"] { padding: 6px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: #c9d1d9; font-size: 13px; }
  .controls .symbols-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls .symbols-group label { display: flex; align-items: center; gap: 3px; font-size: 13px; color: #c9d1d9; margin: 0; }
  .controls button { padding: 7px 14px; background: #238636; color: #fff; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .controls button:hover { background: #2ea043; }
  .controls button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

  .preset-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .preset-btn { padding: 5px 10px; background: #21262d; border: 1px solid #30363d; border-radius: 5px; color: #c9d1d9; font-size: 12px; cursor: pointer; }
  .preset-btn:hover { background: #30363d; }

  .progress { margin-top: 12px; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; font-size: 13px; display: none; }
  .progress-bar { width: 100%; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: width .3s; }

  table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; font-size: 13px; margin-top: 8px; }
  th { background: #21262d; color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; text-align: left; font-weight: 600; }
  td { padding: 8px 10px; border-top: 1px solid #21262d; }
  tr:hover { background: #1c2128; }
  tr.best-row { background: #23863622; }
  tr.best-row td { color: #3fb950; font-weight: 600; }

  .hint { font-size: 11px; color: #8b949e; margin-top: 8px; line-height: 1.6; }
  .error { padding: 12px; background: #f8514922; color: #f85149; border: 1px solid #f8514944; border-radius: 6px; margin-top: 12px; }

  .profit { color: #3fb950; }
  .loss { color: #f85149; }
  .warn { color: #d29922; }
  .blue { color: #58a6ff; }

  .plan-card { padding: 12px 14px; border-radius: 8px; margin-top: 12px; line-height: 1.7; font-size: 13px; }
  .plan-a { background: #1f6feb11; border: 1px solid #1f6feb44; }
  .plan-b { background: #23863611; border: 1px solid #23863644; }
  .plan-c { background: #d2992211; border: 1px solid #d2992244; }

  .plan-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="container">
  <h1>📈 股票自动交易策略A-止盈回测工具</h1>
  <div class="desc">
    用历史 5 分钟 K 线模拟策略入场，对比三种止盈方案的历史表现。<br>
    <strong>注意</strong>：此回测<strong>跳过新闻条件</strong>，只使用动量 + ATR + K线振幅 + 趋势确认。入场信号和止损规则完全一致，<strong>只对比止盈机制</strong>。
  </div>

  <div class="controls">
    <label>开始日期：</label>
    <input type="date" id="startDate">
    <label>结束日期：</label>
    <input type="date" id="endDate">

    <div class="symbols-group" id="symbolsGroup">
      <label><input type="checkbox" value="TSLA" checked> TSLA</label>
      <label><input type="checkbox" value="AAPL" checked> AAPL</label>
      <label><input type="checkbox" value="GOOGL" checked> GOOGL</label>
      <label><input type="checkbox" value="NVDA" checked> NVDA</label>
      <label><input type="checkbox" value="META" checked> META</label>
    </div>

    <button id="btnRun">▶ 开始回测</button>
  </div>

  <div class="preset-row">
    <button class="preset-btn" data-days="10">最近 10 天</button>
    <button class="preset-btn" data-days="20">最近 20 天</button>
    <button class="preset-btn" data-days="30">最近 30 天</button>
    <button class="preset-btn" data-days="60">最近 60 天</button>
    <button class="preset-btn" data-days="90">最近 90 天</button>
    <button class="preset-btn" data-days="180">最近 180 天</button>
  </div>

  <div class="progress" id="progress">
    <span id="progressText">准备中...</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="resultArea"></div>
</div>

<script>
const WORKER_URL = "https://trading-proxy.jimwayi.workers.dev";

// ═══════════════════════════════════════════════
// 回测参数
// ═══════════════════════════════════════════════
const TIMEFRAME = '5Min';
const MOMENTUM_THRESHOLD_PCT = 0.35;
const ATR_THRESHOLD_PCT = 1.5;
const BAR_RANGE_MAX_PCT = 1.0;
const FIXED_STOP_LOSS_PCT = 1.5;   // 简化：固定 1.5% 止损（不启用分级止损，专注对比止盈）

// 三种止盈方案
const PLANS = {
  A: {
    name: '当前方案',
    desc: '1.5% 卖 50% + 剩余跟踪回撤 0.8%',
    partial1Trigger: 1.5,
    partial1Size: 0.5,
    partial2Trigger: null,
    partial2Size: 0,
    trailingMode: 'fixed',
    trailingValue: 0.8
  },
  B: {
    name: '推荐组合',
    desc: '1.5% 卖 40% + 3.0% 卖 30% + 剩余 ATR×0.8 跟踪',
    partial1Trigger: 1.5,
    partial1Size: 0.4,
    partial2Trigger: 3.0,
    partial2Size: 0.3,
    trailingMode: 'atr',
    trailingValue: 0.8
  },
  C: {
    name: '中间方案',
    desc: '1.5% 卖 50% + 剩余跟踪回撤 1.2%',
    partial1Trigger: 1.5,
    partial1Size: 0.5,
    partial2Trigger: null,
    partial2Size: 0,
    trailingMode: 'fixed',
    trailingValue: 1.2
  }
};

// ═══════════════════════════════════════════════
// UI 事件
// ═══════════════════════════════════════════════
const today = new Date();
const d30ago = new Date(today.getTime() - 30 * 24 * 3600 * 1000);
document.getElementById('endDate').value = today.toISOString().split('T')[0];
document.getElementById('startDate').value = d30ago.toISOString().split('T')[0];

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const days = parseInt(btn.dataset.days);
    const end = new Date();
    const start = new Date(end.getTime() - days * 24 * 3600 * 1000);
    document.getElementById('endDate').value = end.toISOString().split('T')[0];
    document.getElementById('startDate').value = start.toISOString().split('T')[0];
  });
});

document.getElementById('btnRun').addEventListener('click', runBacktest);

// ═══════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════
async function runBacktest() {
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  const symbols = Array.from(document.querySelectorAll('#symbolsGroup input:checked')).map(c => c.value);

  if (!startDate || !endDate) { alert('请选择开始和结束日期'); return; }
  if (symbols.length === 0) { alert('请至少选择一只股票'); return; }

  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = '';
  document.getElementById('btnRun').disabled = true;

  const progress = document.getElementById('progress');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');
  progress.style.display = 'block';

  try {
    // 1. 拉取 K 线
    const allBars = {};
    for (let i = 0; i < symbols.length; i++) {
      const sym = symbols[i];
      progressText.textContent = `拉取 ${sym} 历史 K 线...`;
      progressFill.style.width = `${((i + 0.5) / symbols.length) * 30}%`;

      const bars = await fetchBars(sym, startDate, endDate);
      allBars[sym] = bars;
      console.log(`${sym}: ${bars.length} 根 K 线`);
      await new Promise(r => setTimeout(r, 300));
    }

    // 2. 生成统一的入场信号（含 ATR%）
    progressText.textContent = '生成入场信号...';
    progressFill.style.width = '40%';

    const entrySignals = {};
    for (const sym of symbols) {
      entrySignals[sym] = findEntrySignals(allBars[sym]);
    }

    // 3. 对三个方案分别模拟
    const results = {};
    for (const key in PLANS) {
      progressText.textContent = `模拟方案 ${key} (${PLANS[key].name})...`;
      progressFill.style.width = `${40 + Object.keys(PLANS).indexOf(key) / 3 * 55}%`;
      results[key] = simulatePlan(allBars, entrySignals, PLANS[key]);
      await new Promise(r => setTimeout(r, 100));
    }

    progressFill.style.width = '100%';
    progressText.textContent = '完成';
    renderResults(results, symbols, startDate, endDate);

  } catch (e) {
    console.error(e);
    resultArea.innerHTML = `<div class="error">错误：${e.message}</div>`;
  } finally {
    document.getElementById('btnRun').disabled = false;
    setTimeout(() => { progress.style.display = 'none'; }, 1500);
  }
}

// ═══════════════════════════════════════════════
// 拉取 K 线
// ═══════════════════════════════════════════════
async function fetchBars(symbol, startDate, endDate) {
  const start = new Date(startDate + 'T13:00:00Z').toISOString();
  const end = new Date(new Date(endDate).getTime() + 24 * 3600 * 1000).toISOString();

  const url = `${WORKER_URL}/alpaca-data/v2/stocks/${symbol}/bars?timeframe=${TIMEFRAME}&start=${start}&end=${end}&limit=10000&feed=iex&sort=asc`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${symbol} K线 HTTP ${resp.status}`);
  const data = await resp.json();
  return (data.bars || []).map(b => ({
    time: new Date(b.t).getTime(),
    open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v
  }));
}

// ═══════════════════════════════════════════════
// 找入场信号
// ═══════════════════════════════════════════════
function findEntrySignals(bars) {
  if (!bars || bars.length < 22) return [];

  const signals = [];

  for (let i = 20; i < bars.length; i++) {
    const bar = bars[i];
    const price = bar.close;

    const barRange = ((bar.high - bar.low) / bar.close) * 100;
    if (barRange > BAR_RANGE_MAX_PCT) continue;

    let atrSum = 0;
    for (let j = i - 19; j <= i; j++) {
      atrSum += ((bars[j].high - bars[j].low) / bars[j].close) * 100;
    }
    const atrPct = atrSum / 20;
    if (atrPct > ATR_THRESHOLD_PCT) continue;

    const pastPrice = bars[i - 3].close;
    const momentumPct = ((price - pastPrice) / pastPrice) * 100;
    if (momentumPct < MOMENTUM_THRESHOLD_PCT) continue;

    const recent = bars.slice(i - 2, i + 1);
    if (recent.length < 3) continue;
    if (recent[recent.length - 1].close <= recent[0].open) continue;
    let upCount = 0;
    for (let k = 1; k < recent.length; k++) {
      if (recent[k].close > recent[k - 1].close) upCount++;
    }
    if (upCount < 2) continue;

    signals.push({ index: i, price: price, time: bar.time, atrPct: atrPct });
  }

  return signals;
}

// ═══════════════════════════════════════════════
// 核心模拟：单个方案
// ═══════════════════════════════════════════════
function simulatePlan(allBars, entrySignals, plan) {
  // 收集所有信号，按时间排序
  const allSignals = [];
  for (const sym in entrySignals) {
    entrySignals[sym].forEach(s => allSignals.push({ sym, ...s }));
  }
  allSignals.sort((a, b) => a.time - b.time);

  const trades = [];
  let position = null;

  for (const sig of allSignals) {
    if (position) continue;   // 简化：每次只持 1 只

    const bars = allBars[sig.sym];
    if (!bars || sig.index >= bars.length) continue;

    const entryPrice = sig.price;
    const entryTime = sig.time;
    const atrPct = sig.atrPct;

    // 初始止损
    const stopPrice = entryPrice * (1 - FIXED_STOP_LOSS_PCT / 100);

    // 状态
    let remaining = 1.0;
    let realizedPnlPct = 0;
    let highPrice = entryPrice;
    let partial1Done = false;
    let partial2Done = false;
    let exitIdx = -1;
    let exitReason = null;
    let exitPrice = 0;

    // 计算跟踪回撤
    let trailRetreatPct;
    if (plan.trailingMode === 'fixed') {
      trailRetreatPct = plan.trailingValue;
    } else if (plan.trailingMode === 'atr') {
      trailRetreatPct = Math.max(0.5, Math.min(1.5, atrPct * plan.trailingValue));
    }

    for (let j = sig.index + 1; j < bars.length; j++) {
      const bar = bars[j];
      const barPrice = bar.close;

      // 更新最高价（用 high）
      if (bar.high > highPrice) highPrice = bar.high;

      // 1. 检查止损（先用 low，保守）
      if (bar.low <= stopPrice) {
        realizedPnlPct += remaining * ((stopPrice - entryPrice) / entryPrice) * 100;
        exitIdx = j;
        exitReason = 'stop';
        exitPrice = stopPrice;
        remaining = 0;
        break;
      }

      // 2. 检查第一段部分止盈
      const pnlPct = ((barPrice - entryPrice) / entryPrice) * 100;
      if (!partial1Done && pnlPct >= plan.partial1Trigger) {
        realizedPnlPct += plan.partial1Size * pnlPct;
        remaining -= plan.partial1Size;
        partial1Done = true;
      }

      // 3. 检查第二段部分止盈
      if (plan.partial2Trigger && !partial2Done && pnlPct >= plan.partial2Trigger) {
        realizedPnlPct += plan.partial2Size * pnlPct;
        remaining -= plan.partial2Size;
        partial2Done = true;
      }

      // 4. 检查跟踪止盈（第一段触发后启用）
      if (partial1Done && remaining > 0.001) {
        const trailPrice = highPrice * (1 - trailRetreatPct / 100);
        if (barPrice <= trailPrice) {
          const trailPnlPct = ((trailPrice - entryPrice) / entryPrice) * 100;
          realizedPnlPct += remaining * trailPnlPct;
          exitIdx = j;
          exitReason = 'trailing';
          exitPrice = trailPrice;
          remaining = 0;
          break;
        }
      }
    }

    // 如果没触发任何出场（到数据末尾），用最后一根 K 线收盘价平仓
    if (exitIdx === -1) {
      const lastBar = bars[bars.length - 1];
      const lastPnlPct = ((lastBar.close - entryPrice) / entryPrice) * 100;
      realizedPnlPct += remaining * lastPnlPct;
      exitIdx = bars.length - 1;
      exitReason = 'eod';
      exitPrice = lastBar.close;
    }

    trades.push({
      symbol: sig.sym,
      entryTime,
      exitTime: bars[exitIdx].time,
      entryPrice,
      exitPrice,
      pnlPct: realizedPnlPct,
      atrPct,
      exitReason
    });

    position = null;   // 立即释放
  }

  // 汇总
  const wins = trades.filter(t => t.pnlPct > 0);
  const losses = trades.filter(t => t.pnlPct < 0);
  const totalPnlPct = trades.reduce((s, t) => s + t.pnlPct, 0);
  const avgPnlPct = trades.length > 0 ? totalPnlPct / trades.length : 0;
  const avgWin = wins.length > 0 ? wins.reduce((s, t) => s + t.pnlPct, 0) / wins.length : 0;
  const avgLoss = losses.length > 0 ? losses.reduce((s, t) => s + t.pnlPct, 0) / losses.length : 0;
  const winRate = trades.length > 0 ? (wins.length / trades.length) * 100 : 0;

  // 出场原因统计
  const stopCount = trades.filter(t => t.exitReason === 'stop').length;
  const trailingCount = trades.filter(t => t.exitReason === 'trailing').length;
  const eodCount = trades.filter(t => t.exitReason === 'eod').length;

  return {
    plan,
    totalTrades: trades.length,
    totalPnlPct,
    avgPnlPct,
    avgWin,
    avgLoss,
    winRate,
    stopCount,
    trailingCount,
    eodCount,
    trades
  };
}

// ═══════════════════════════════════════════════
// 渲染结果
// ═══════════════════════════════════════════════
function renderResults(results, symbols, startDate, endDate) {
  const area = document.getElementById('resultArea');

  // 找最佳方案
  let bestKey = null;
  let bestPnl = -Infinity;
  for (const k in results) {
    if (results[k].totalPnlPct > bestPnl) {
      bestPnl = results[k].totalPnlPct;
      bestKey = k;
    }
  }

  let html = `<h2>📊 止盈方案对比（${startDate} 至 ${endDate}）</h2>`;
  html += `<div class="hint">监控标的：${symbols.join('、')} | 入场条件：动量 + ATR + 趋势确认（跳过新闻） | 止损：固定 ${FIXED_STOP_LOSS_PCT}%</div>`;

  // 方案说明卡片
  html += `<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px;">`;
  for (const k in PLANS) {
    const p = PLANS[k];
    const cls = k === 'A' ? 'plan-a' : k === 'B' ? 'plan-b' : 'plan-c';
    const r = results[k];
    const isBest = k === bestKey;
    html += `<div class="plan-card ${cls}">
      <div class="plan-title">方案 ${k}：${p.name}${isBest ? ' ⭐' : ''}</div>
      <div style="color:#8b949e; font-size:12px;">${p.desc}</div>
      <div style="margin-top:8px;">
        <span style="color:#8b949e;">总盈亏：</span>
        <span style="font-weight:700; font-size:16px;" class="${r.totalPnlPct >= 0 ? 'profit' : 'loss'}">${r.totalPnlPct >= 0 ? '+' : ''}${r.totalPnlPct.toFixed(2)}%</span>
      </div>
    </div>`;
  }
  html += `</div>`;

  // 详细对比表
  html += `<h2>🔍 详细对比</h2>`;
  html += `<table><thead><tr>
    <th>指标</th>
    <th>方案 A（当前）</th>
    <th>方案 B（推荐）</th>
    <th>方案 C（中间）</th>
  </tr></thead><tbody>`;

  const row = (label, values, cls = '') => {
    return `<tr>
      <td>${label}</td>
      ${values.map(v => `<td class="${cls}">${v}</td>`).join('')}
    </tr>`;
  };

  html += row('总交易笔数', ['A','B','C'].map(k => results[k].totalTrades));
  html += row('总盈亏 (%)',
    ['A','B','C'].map(k => {
      const r = results[k];
      return `<span class="${r.totalPnlPct >= 0 ? 'profit' : 'loss'}">${r.totalPnlPct >= 0 ? '+' : ''}${r.totalPnlPct.toFixed(2)}%</span>`;
    })
  );
  html += row('平均每笔 (%)',
    ['A','B','C'].map(k => {
      const r = results[k];
      return `<span class="${r.avgPnlPct >= 0 ? 'profit' : 'loss'}">${r.avgPnlPct >= 0 ? '+' : ''}${r.avgPnlPct.toFixed(3)}%</span>`;
    })
  );
  html += row('胜率 (%)', ['A','B','C'].map(k => results[k].winRate.toFixed(1) + '%'));
  html += row('平均盈利 (%)',
    ['A','B','C'].map(k => `<span class="profit">+${results[k].avgWin.toFixed(2)}%</span>`)
  );
  html += row('平均亏损 (%)',
    ['A','B','C'].map(k => `<span class="loss">${results[k].avgLoss.toFixed(2)}%</span>`)
  );
  html += row('盈亏比',
    ['A','B','C'].map(k => {
      const r = results[k];
      if (r.avgLoss === 0) return '—';
      const ratio = Math.abs(r.avgWin / r.avgLoss);
      return ratio.toFixed(2);
    })
  );
  html += row('止损笔数', ['A','B','C'].map(k => results[k].stopCount));
  html += row('跟踪止盈笔数', ['A','B','C'].map(k => results[k].trailingCount));
  html += row('到末尾未平仓笔数', ['A','B','C'].map(k => results[k].eodCount));

  html += '</tbody></table>';

  // 建议
  const bestR = results[bestKey];
  const aR = results.A;
  const bR = results.B;
  const improvement = bestKey !== 'A' ? ((bestR.totalPnlPct - aR.totalPnlPct) / Math.abs(aR.totalPnlPct || 1) * 100) : 0;

  html += `<div class="rec-box" style="padding:14px; border-radius:8px; margin-top:16px; background:#23863622; border:1px solid #23863644; color:#3fb950; font-size:14px; line-height:1.7;">
    <strong>💡 结论：</strong>历史回测期内，<strong>方案 ${bestKey}（${PLANS[bestKey].name}）</strong> 表现最好，总盈亏 <strong>${bestR.totalPnlPct.toFixed(2)}%</strong>。
    ${bestKey !== 'A' ? `相比当前的方案 A 提升约 <strong>${improvement.toFixed(1)}%</strong>。` : '与当前方案 A 一致或当前方案已是最优。'}
  </div>`;

  // 提示
  html += `<div class="hint">
    <strong>说明：</strong><br>
    1. 回测跳过新闻情绪条件，只使用技术指标生成入场信号，因此交易次数比真实策略更多。<br>
    2. 止损简化为固定 ${FIXED_STOP_LOSS_PCT}%，未启用分级止损，专注对比止盈机制。<br>

    4. "到末尾未平仓" = 数据末尾仍持有，用最后一根 K 线收盘价平仓。<br>
    5. 时间段越短，样本越小，结论越不可靠。建议至少 30-60 天。
  </div>`;

  area.innerHTML = html;
