<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>股票自动交易策略A - 实盘面板</title>
<style>
  /* 这里保留你原有的面板样式，为简洁起见，保留核心样式 */
  body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
  .panel { max-width: 1200px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
  .btn:hover { background: #2ea043; }
  .btn-danger { background: #da3633; }
  .btn-danger:hover { background: #f85149; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
  .card-label { font-size: 12px; color: #8b949e; }
  .card-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
  .status-bar { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; }
  .log-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
  .log-line { margin-bottom: 4px; }
  .log-time { color: #8b949e; margin-right: 8px; }
  .log-info { color: #58a6ff; }
  .log-success { color: #3fb950; }
  .log-warn { color: #d29922; }
  .log-error { color: #f85149; }
  .profit { color: #3fb950; }
  .loss { color: #f85149; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <h1>股票自动交易策略A - 实盘面板</h1>
    <div>
      <button class="btn" id="btnStart">启动策略</button>
      <button class="btn btn-danger" id="btnStop" style="margin-left: 10px;">停止策略</button>
    </div>
  </div>

  <!-- 市场状态栏 -->
  <div class="status-bar">
    <div><span class="card-label">市场状态：</span><span id="marketStatus">--</span></div>
    <div><span class="card-label">数据源：</span><span id="dataSource">--</span></div>
    <div><span class="card-label">今日盈亏：</span><span id="dailyPnl" class="profit">--</span></div>
    <div><span class="card-label">当前持仓：</span><span id="currentPositions">--</span></div>
  </div>

  <!-- 资产概览 -->
  <div class="grid">
    <div class="card"><div class="card-label">总资产</div><div class="card-value" id="totalEquity">$0.00</div></div>
    <div class="card"><div class="card-label">可用现金</div><div class="card-value" id="cash">$0.00</div></div>
    <div class="card"><div class="card-label">当日盈亏</div><div class="card-value" id="dailyPnlCard">$0.00</div></div>
    <div class="card"><div class="card-label">当月盈亏</div><div class="card-value" id="monthlyPnlCard">$0.00</div></div>
  </div>

  <!-- 运行日志 -->
  <h2>实时运行日志</h2>
  <div class="log-box" id="logBox"></div>
  <button class="btn" id="btnExportLog" style="margin-top: 10px;">导出今日运行日志</button>
</div>

<script>
// ============================================================
// 配置区域
// ============================================================
const CONFIG = {
  WORKER_URL: "https://trading-proxy.jimwayi.workers.dev",
  VAL_TOWN_WEBHOOK_URL: "YOUR_VAL_TOWN_WEBHOOK_URL", // 替换为你的 Val Town URL
  SYMBOLS: {
    AUTO_TRADE: ['META', 'TSLA'], // 默认自动交易
    MONITOR_ONLY: ['AAPL', 'GOOGL', 'NVDA'] // 仅监控，不自动交易
  },
  PARAMS: {
    BASE_SIZE: 5,           // 基础仓位 5%
    PARTIAL_TP: 2.0,        // 部分止盈触发 2.0%
    PARTIAL_TP_QTY: 50,     // 部分止盈卖出 50%
    FIXED_TP: 2.5,          // 固定止盈 2.5%
    MOMENTUM_THRESHOLD: 0.6, // 动量阈值 0.6%
    ATR_THRESHOLD: 1.0,     // ATR阈值 1.0%
    MAX_POSITIONS: 3,       // 最大持仓数 3
    MAX_TOTAL_EXPOSURE: 50, // 总敞口上限 50%
    CIRCUIT_BREAKER: 1.5,   // 日内熔断 1.5%
    FORCE_CLOSE_TIME: 950   // 收盘强平 15:50 (美东分)
  }
};

let isRunning = false;
let logHistory = [];

// ============================================================
// 日志系统
// ============================================================
function addLog(message, type = 'info') {
  const time = new Date().toLocaleTimeString('zh-CN', { timeZone: 'America/New_York', hour12: false });
  const logEntry = { time, message, type };
  logHistory.push(logEntry);

  const logBox = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = `log-line log-${type}`;
  line.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

function exportTodayLogs() {
  const content = logHistory.map(l => `[${l.time}] [${l.type.toUpperCase()}] ${l.message}`).join('\n');
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trading_log_${new Date().toISOString().split('T')[0]}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// Val Town 通知
// ============================================================
async function sendValTownNotification(subject, message) {
  if (CONFIG.VAL_TOWN_WEBHOOK_URL === "YOUR_VAL_TOWN_WEBHOOK_URL") {
    addLog('未配置 Val Town Webhook URL，跳过通知发送。', 'warn');
    return;
  }
  try {
    await fetch(CONFIG.VAL_TOWN_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subject, message, timestamp: Date.now() })
    });
    addLog(`Val Town 通知已发送: ${subject}`, 'success');
  } catch (e) {
    addLog(`Val Town 通知发送失败: ${e.message}`, 'error');
  }
}

// ============================================================
// 策略核心逻辑 (简化版，需根据你的Worker逻辑完善)
// ============================================================
async function runStrategyLoop() {
  if (!isRunning) return;

  try {
    // 1. 获取市场状态 (SPY 5分钟)
    // 2. 获取监控标的数据 (META, TSLA 自动交易; AAPL, GOOGL, NVDA 仅获取价格)
    // 3. 评估入场条件 (动量、ATR、新闻)
    // 4. 检查持仓出场条件 (部分止盈、固定止盈、止损、熔断、收盘强平)
    // 5. 执行交易 (Alpaca API)

    // 这里模拟运行日志
    addLog('策略运行中，检查市场状态...', 'info');
    
    // 模拟通知
    // await sendValTownNotification('策略状态更新', '今日已运行，无异常。');

  } catch (e) {
    addLog(`策略运行出错: ${e.message}`, 'error');
  }

  // 每分钟循环一次
  setTimeout(runStrategyLoop, 60000);
}

// ============================================================
// UI 事件绑定
// ============================================================
document.getElementById('btnStart').addEventListener('click', () => {
  if (isRunning) return;
  isRunning = true;
  addLog('策略已启动。自动交易标的：META, TSLA。监控标的：AAPL, GOOGL, NVDA。', 'success');
  sendValTownNotification('策略启动', '股票自动交易策略A已启动。');
  runStrategyLoop();
});

document.getElementById('btnStop').addEventListener('click', () => {
  if (!isRunning) return;
  isRunning = false;
  addLog('策略已手动停止。', 'warn');
  sendValTownNotification('策略停止', '股票自动交易策略A已手动停止。');
});

document.getElementById('btnExportLog').addEventListener('click', exportTodayLogs);

// 初始化
addLog('面板初始化完成。等待启动策略。', 'info');
addLog(`自动交易标的：${CONFIG.SYMBOLS.AUTO_TRADE.join(', ')}`, 'info');
addLog(`仅监控标的：${CONFIG.SYMBOLS.MONITOR_ONLY.join(', ')}`, 'info');
addLog(`定型参数：固定止盈 ${CONFIG.PARAMS.FIXED_TP}%，部分止盈 ${CONFIG.PARAMS.PARTIAL_TP}%，最大持仓 ${CONFIG.PARAMS.MAX_POSITIONS}只。`, 'info');
</script>
</body>
</html>
