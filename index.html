<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实时 Paper Trading 监控面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; padding: 12px; }
  .container { display: grid; grid-template-columns: 360px 1fr 380px; gap: 12px; height: calc(100vh - 24px); }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; overflow-y: auto; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: #8b949e; margin-top: 10px; margin-bottom: 3px; }
  input, select { width: 100%; padding: 6px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 13px; }
  input:focus, select:focus { outline: none; border-color: #58a6ff; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-start { background: #238636; color: #fff; }
  .btn-start:hover { background: #2ea043; }
  .btn-stop { background: #da3633; color: #fff; }
  .btn-stop:hover { background: #f85149; }
  .btn-reset { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-reset:hover { background: #30363d; }
  .log-entry { font-size: 12px; padding: 4px 6px; border-bottom: 1px solid #21262d; font-family: "SF Mono", monospace; }
  .buy { color: #3fb950; } .sell { color: #f85149; } .info { color: #8b949e; }
  .warn { color: #d29922; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .stat { background: #0d1117; border-radius: 6px; padding: 8px; }
  .stat-label { font-size: 11px; color: #8b949e; }
  .stat-value { font-size: 18px; font-weight: 600; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .badge-live { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
  .badge-idle { background: #8b949e33; color: #8b949e; border: 1px solid #8b949e; }
  .badge-error { background: #f8514933; color: #f85149; border: 1px solid #f85149; }
  .badge-auto { background: #d2992233; color: #d29922; border: 1px solid #d29922; }
  .news-status { font-size: 11px; padding: 4px 6px; border-radius: 4px; margin-top: 6px; }
  .news-ok { background: #3fb95022; color: #3fb950; border: 1px solid #3fb95044; }
  .news-fallback { background: #d2992222; color: #d29922; border: 1px solid #d2992244; }
  .news-fail { background: #f8514922; color: #f85149; border: 1px solid #f8514944; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #c9d1d9; margin: 0; }
  .checkbox-group input { width: auto; }
  .hint { font-size: 10px; color: #8b949e; margin-top: 4px; line-height: 1.4; }
  .timer { font-size: 24px; font-weight: 700; color: #58a6ff; text-align: center; margin-top: 8px; }
  .auto-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .auto-row input { width: auto; }
  .auto-row label { margin: 0; font-size: 13px; color: #c9d1d9; }
  .auto-info { font-size: 11px; color: #8b949e; margin-top: 4px; }
</style>
</head>
<body>

<div class="container">

  <div class="panel">
    <h3>实时交易控制</h3>

  <div class="panel">

<script>
// ═══════════════════════════════════════════════
// 配置
// ═══════════════════════════════════════════════
const WORKER_URL = "https://trading-proxy.jimwayi.workers.dev";
const NTFY_TOPIC = "Stocktrade-alert-2026";
const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}`;

const APITUBE_ENTITY_ID_MAP = {
  'AAPL': '1302944',
  'GOOGL': '1696869',
  'TSLA': '1580517',
  'NVDA': '1280220',
  'META': '1279593'
};

const SLIPPAGE_MAP = {
  TSLA: 0.001, AAPL: 0.001, GOOGL: 0.001,
  NVDA: 0.0005, META: 0.0005
};

const NEWS_INTERVAL_HIGH_VOL = 10 * 60 * 1000;
const NEWS_INTERVAL_NORMAL = 12 * 60 * 1000;
const NEWS_STALE_LIMIT = 30 * 60 * 1000;
const MAX_DAILY_TRADES_PER_SYMBOL = 3;
const COMPOSITE_HIGH_THRESHOLD = 0.8;

// ═══════════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════════
let running = false;
let isCycling = false;
let newsUpdating = false;
let timerInterval = null;
let countdownInterval = null;
let autoCheckInterval = null;
let secondsUntilNext = 0;

let newsCache = {};
let lastNewsFetchTime = 0;
let lastStaleWarningTime = 0;

let dailyTradeCount = {};
let currentTradeDate = '';
let lastCloseTime = {};
let positionHighPrice = {};

// 自动启停状态
let autoStartedToday = false;
let autoStoppedToday = false;

// ═══════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════
function log(msg, cls = 'info') {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = `log-entry ${cls}`;
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'America/New_York' });
  div.textContent = `[${ts}] ${msg}`;
  el.prepend(div);
  if (el.children.length > 500) el.removeChild(el.lastChild);
}

function getSelectedSymbols() {
  return Array.from(document.querySelectorAll('#symbols input:checked')).map(c => c.value);
}

function getEasternTime() {
  const now = new Date();
  const etStr = now.toLocaleString("en-US", { timeZone: "America/New_York" });
  return new Date(etStr);
}

function getEasternMinutes() {
  const et = getEasternTime();
  return et.getHours() * 60 + et.getMinutes();
}

function getEasternDateString() {
  const et = getEasternTime();
  return `${et.getFullYear()}-${String(et.getMonth()+1).padStart(2,'0')}-${String(et.getDate()).padStart(2,'0')}`;
}

function isMarketOpen() {
  const m = getEasternMinutes();
  return m >= 570 && m < 960;
}

function isHighVolatilityPeriod() {
  const m = getEasternMinutes();
  return (m >= 570 && m < 630) || (m >= 900 && m < 960);
}

function getNewsInterval() {
  return isHighVolatilityPeriod() ? NEWS_INTERVAL_HIGH_VOL : NEWS_INTERVAL_NORMAL;
}

function timeStrToMinutes(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function cleanupPositionState(sym, closed) {
  delete positionHighPrice[sym];
  delete positionHighPrice[sym + '_added'];
  if (closed) {
    lastCloseTime[sym] = Date.now();
    dailyTradeCount[sym] = (dailyTradeCount[sym] || 0) + 1;
  }
}

// ═══════════════════════════════════════════════
// 自动启停
// ═══════════════════════════════════════════════
function checkAutoStartStop() {
  const enabled = document.getElementById('autoStartStop').checked;
  const infoEl = document.getElementById('autoInfo');

  if (!enabled) {
    infoEl.textContent = '自动启停已关闭';
    return;
  }

  const today = getEasternDateString();
  if (today !== currentTradeDate) {
    autoStartedToday = false;
    autoStoppedToday = false;
  }

  const startStr = document.getElementById('autoStartTime').value;
  const stopStr = document.getElementById('autoStopTime').value;
  const startMin = timeStrToMinutes(startStr);
  const stopMin = timeStrToMinutes(stopStr);
  const nowMin = getEasternMinutes();

  const et = getEasternTime();
  const day = et.getDay();
  const isWeekday = day >= 1 && day <= 5;

  if (!isWeekday) {
    infoEl.textContent = `周末休市（美东 ${et.toLocaleDateString('zh-CN')}）`;
    return;
  }

  // 自动启动
  if (!autoStartedToday && nowMin >= startMin && nowMin < stopMin) {
    autoStartedToday = true;
    log(`⏰ 自动启动触发 (美东 ${startStr})`, 'buy');
    if (!running) startLoop();
    return;
  }

  // 自动停止
  if (!autoStoppedToday && nowMin >= stopMin) {
    autoStoppedToday = true;
    log(`⏰ 自动停止触发 (美东 ${stopStr})`, 'warn');
    if (running) stopLoop();
    return;
  }

  // 更新提示
  if (!autoStartedToday && nowMin < startMin) {
    const remain = startMin - nowMin;
    infoEl.textContent = `等待自动启动：约 ${remain} 分钟后（美东 ${startStr}）`;
  } else if (autoStartedToday && !autoStoppedToday) {
    const remain = stopMin - nowMin;
    infoEl.textContent = `运行中：约 ${remain} 分钟后自动停止（美东 ${stopStr}）`;
  } else if (autoStoppedToday) {
    infoEl.textContent = `今日已自动停止，等待明天 ${startStr}（美东）`;
  }
}

// ═══════════════════════════════════════════════
// ntfy 通知
// ═══════════════════════════════════════════════
async function sendNotification(title, message, priority = '3', tags = '') {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 5000);
  try {
    const headers = { 'Title': title, 'Priority': priority };
    if (tags) headers['Tags'] = tags;
    await fetch(NTFY_URL, { method: 'POST', headers, body: message, signal: controller.signal });
  } catch (e) {
    console.error('ntfy 通知失败:', e);
  } finally {
    clearTimeout(timeoutId);
  }
}

// ═══════════════════════════════════════════════
// 新闻情绪
// ═══════════════════════════════════════════════
function articleStronglyMentionsEntity(article, entityId, minFreq = 2) {
  if (!article.entities || !Array.isArray(article.entities)) return false;
  return article.entities.some(e =>
    String(e.id) === String(entityId) && (e.frequency || 0) >= minFreq
  );
}

async function fetchSentimentAPITube(symbol) {
  const entityId = APITUBE_ENTITY_ID_MAP[symbol];
  if (!entityId) throw new Error(`未配置 ${symbol} 实体 ID`);
  const url = `${WORKER_URL}/news/?entity.id=${entityId}&per_page=10&sort.by=sentiment.overall.score&sort.order=desc`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`APITube ${resp.status}`);
  const json = await resp.json();
  const articles = json.results || [];
  if (articles.length === 0) return { bullish: false, score: 0, source: 'apitube' };
  const strong = articles.filter(a => articleStronglyMentionsEntity(a, entityId));
  const target = strong.length >= 2 ? strong : articles;
  let total = 0, count = 0;
  target.forEach(a => {
    if (a.sentiment?.overall?.score !== undefined) { total += a.sentiment.overall.score; count++; }
  });
  const avg = count > 0 ? total / count : 0;
  return { bullish: avg > 0.3, score: Math.abs(avg), source: 'apitube' };
}

async function fetchSentimentMarketaux(symbol) {
  const url = `${WORKER_URL}/marketaux/?symbols=${symbol}&filter_entities=true&limit=10`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Marketaux ${resp.status}`);
  const json = await resp.json();
  const articles = json.data || [];
  if (articles.length === 0) return { bullish: false, score: 0, source: 'marketaux' };
  let total = 0, count = 0;
  articles.forEach(a => {
    (a.entities || []).forEach(e => {
      if (e.symbol === symbol && e.sentiment_score !== undefined) { total += e.sentiment_score; count++; }
    });
  });
  const avg = count > 0 ? total / count : 0;
  return { bullish: avg > 0.3, score: Math.abs(avg), source: 'marketaux' };
}

async function fetchSentimentKiprio(symbol) {
  const url = `${WORKER_URL}/kiprio/v1/sentiment`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: `${symbol} stock news recent price action` })
  });
  if (!resp.ok) throw new Error(`Kiprio ${resp.status}`);
  const json = await resp.json();
  const compound = json.compound || 0;
  return { bullish: compound > 0.2, score: Math.abs(compound), source: 'kiprio' };
}

async function fetchNewsSentiment(symbol) {
  try { return await fetchSentimentAPITube(symbol); }
  catch (e) { log(`APITube 失败 (${symbol}): ${e.message}，降级 Marketaux`, 'warn'); }
  try { return await fetchSentimentMarketaux(symbol); }
  catch (e) { log(`Marketaux 失败 (${symbol}): ${e.message}，降级 Kiprio`, 'warn'); }
  try { return await fetchSentimentKiprio(symbol); }
  catch (e) { log(`Kiprio 失败 (${symbol}): ${e.message}`, 'sell'); }
  return { bullish: false, score: 0, source: 'none' };
}

function updateNewsCacheAsync(symbols) {
  if (newsUpdating) return;
  newsUpdating = true;
  (async () => {
    try {
      log(`正在后台更新新闻缓存 (${symbols.length} 只)...`, 'info');
      for (const sym of symbols) {
        const result = await fetchNewsSentiment(sym);
        newsCache[sym] = { ...result, updatedAt: Date.now() };
        log(`新闻更新 ${sym}: ${result.bullish ? '看涨' : '中性'} (${result.score.toFixed(2)}) [${result.source}]`, 'info');
        await new Promise(r => setTimeout(r, 1500));
      }
      lastNewsFetchTime = Date.now();
      updateNewsStatusDisplay(symbols);
      log(`新闻缓存更新完成`, 'info');
    } catch (e) {
      log(`新闻缓存更新失败: ${e.message}`, 'sell');
    } finally {
      newsUpdating = false;
    }
  })();
}

function updateNewsStatusDisplay(symbols) {
  const el = document.getElementById('newsStatus');
  const detail = document.getElementById('newsDetail');
  const timeStr = new Date(lastNewsFetchTime).toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'America/New_York' });
  const sample = symbols[0];
  const info = newsCache[sample];
  el.className = 'news-status news-ok';
  if (info) {
    el.textContent = `新闻更新 ${timeStr} | ${sample}: ${info.bullish ? '看涨' : '中性'} (${info.score.toFixed(2)}) [${info.source}]`;
  } else {
    el.textContent = `新闻已更新 ${timeStr}`;
  }
  const interval = getNewsInterval();
  const remainMin = Math.max(0, Math.ceil((interval - (Date.now() - lastNewsFetchTime)) / 60000));
  detail.textContent = `下次更新约 ${remainMin} 分钟后 | 时段: ${isHighVolatilityPeriod() ? '高波动' : '正常'}`;
}

// ═══════════════════════════════════════════════
// Alpaca
// ═══════════════════════════════════════════════
async function fetchLatestBars(symbols, timeframe) {
  const tfMap = { 1: '1Min', 5: '5Min' };
  const results = {};
  for (const sym of symbols) {
    const url = `${WORKER_URL}/alpaca-data/v2/stocks/${sym}/bars?timeframe=${tfMap[timeframe]}&limit=30&feed=iex&sort=desc`;
    try {
      const resp = await fetch(url);
      if (!resp.ok) { log(`获取 ${sym} 行情失败: ${resp.status}`, 'sell'); continue; }
      const json = await resp.json();
      results[sym] = (json.bars || []).reverse().map(b => ({
        time: Math.floor(new Date(b.t).getTime() / 1000),
        open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v
      }));
    } catch (e) { log(`获取 ${sym} 行情异常: ${e.message}`, 'sell'); }
  }
  return results;
}

async function fetchAccount() {
  const resp = await fetch(`${WORKER_URL}/alpaca-trade/v2/account`);
  if (!resp.ok) throw new Error(`账户 API ${resp.status}`);
  return await resp.json();
}

async function fetchPositions() {
  const resp = await fetch(`${WORKER_URL}/alpaca-trade/v2/positions`);
  if (!resp.ok) throw new Error(`持仓 API ${resp.status}`);
  return await resp.json();
}

async function submitOrder(symbol, qty, side, type = 'market', timeInForce = 'day') {
  const body = { symbol, qty: String(qty), side, type, time_in_force: timeInForce };
  const resp = await fetch(`${WORKER_URL}/alpaca-trade/v2/orders`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`下单失败 ${resp.status}: ${err.substring(0, 200)}`);
  }
  return await resp.json();
}

async function closePosition(symbol) {
  const resp = await fetch(`${WORKER_URL}/alpaca-trade/v2/positions/${symbol}`, { method: 'DELETE' });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`平仓失败 ${resp.status}: ${err.substring(0, 200)}`);
  }
  return await resp.json();
}

async function fetchRecentOrders() {
  const resp = await fetch(`${WORKER_URL}/alpaca-trade/v2/orders?status=all&limit=10&direction=desc`);
  if (!resp.ok) throw new Error(`订单 API ${resp.status}`);
  return await resp.json();
}

async function submitSplitOrder(symbol, totalQty, side) {
  const parts = 3;
  const qtyPerPart = totalQty / parts;
  let successCount = 0;

  if (qtyPerPart < 0.0001) {
    try {
      const order = await submitOrder(symbol, totalQty.toFixed(4), side, 'market', 'day');
      log(`订单: ${side} ${symbol} ${totalQty.toFixed(4)}股 | ${order.status}`, side === 'buy' ? 'buy' : 'sell');
      return { success: true, count: 1 };
    } catch (e) {
      log(`下单失败: ${e.message}`, 'sell');
      return { success: false, count: 0 };
    }
  }

  for (let i = 0; i < parts; i++) {
    try {
      const order = await submitOrder(symbol, qtyPerPart.toFixed(4), side, 'market', 'day');
      log(`拆单 ${i+1}/${parts}: ${side} ${symbol} ${qtyPerPart.toFixed(4)}股 | ${order.status}`, side === 'buy' ? 'buy' : 'sell');
      successCount++;
      await new Promise(r => setTimeout(r, 1000));
    } catch (e) {
      log(`拆单 ${i+1}/${parts} 失败: ${e.message}`, 'sell');
    }
  }
  return { success: successCount > 0, count: successCount };
}

function checkUptrend(bars, timeframe) {
  const needed = Math.ceil(15 / timeframe);
  if (bars.length < needed) return false;
  const recent = bars.slice(-needed);
  const startPrice = recent[0].open;
  const endPrice = recent[recent.length - 1].close;
  if (endPrice <= startPrice) return false;
  let upCount = 0;
  for (let i = 1; i < recent.length; i++) {
    if (recent[i].close > recent[i - 1].close) upCount++;
  }
  return upCount >= Math.ceil(needed / 2);
}

// ═══════════════════════════════════════════════
// 策略核心
// ═══════════════════════════════════════════════
async function runOneCycle() {
  if (!running) return;
  if (isCycling) { log('上一轮循环尚未完成，跳过本次', 'warn'); return; }
  isCycling = true;

  try {
    const today = getEasternDateString();
    if (today !== currentTradeDate) {
      currentTradeDate = today;
      dailyTradeCount = {};
      lastCloseTime = {};
      log(`新交易日 ${today}，重置交易计数`, 'info');
    }

    const symbols = getSelectedSymbols();
    const timeframe = parseInt(document.getElementById('timeframe').value);
    const baseSizePct = parseFloat(document.getElementById('baseSize').value);
    const stopLossPct = parseFloat(document.getElementById('stopLoss').value);
    const takeProfitPct = parseFloat(document.getElementById('takeProfit').value);
    const momentumThresholdPct = parseFloat(document.getElementById('momentumThreshold').value);
    const addTriggerPct = parseFloat(document.getElementById('addTrigger').value);
    const addSizePct = parseFloat(document.getElementById('addSize').value);
    const maxExposurePct = parseFloat(document.getElementById('maxExposure').value);
    const maxTotalExposurePct = parseFloat(document.getElementById('maxTotalExposure').value);
    const maxPositions = parseInt(document.getElementById('maxPositions').value);
    const atrThresholdPct = parseFloat(document.getElementById('atrThreshold').value);

    const newsInterval = getNewsInterval();
    if ((Date.now() - lastNewsFetchTime) >= newsInterval) {
      updateNewsCacheAsync(symbols);
    }

    log(`── 检查周期 (${symbols.length}只) ──`, 'info');

    let account;
    try {
      account = await fetchAccount();
      document.getElementById('statEquity').textContent = '$' + parseFloat(account.equity).toFixed(2);
      document.getElementById('statCash').textContent = '$' + parseFloat(account.cash).toFixed(2);
      document.getElementById('statPositionValue').textContent = '$' + (parseFloat(account.equity) - parseFloat(account.cash)).toFixed(2);
      const dayPnl = parseFloat(account.equity) - parseFloat(account.last_equity);
      document.getElementById('statDayPnl').textContent = (dayPnl >= 0 ? '+' : '') + '$' + dayPnl.toFixed(2);
      document.getElementById('accountBadge').textContent = '已连接';
      document.getElementById('accountBadge').className = 'badge badge-live';
    } catch (e) {
      log(`获取账户失败: ${e.message}`, 'sell');
      document.getElementById('accountBadge').textContent = '连接失败';
      document.getElementById('accountBadge').className = 'badge badge-error';
      await sendNotification('⚠️ 系统错误', `获取账户失败: ${e.message}`, '4', 'warning');
      return;
    }

    const newsStale = (Date.now() - lastNewsFetchTime) > NEWS_STALE_LIMIT;
    if (newsStale && (Date.now() - lastStaleWarningTime > NEWS_STALE_LIMIT)) {
      lastStaleWarningTime = Date.now();
      log('⚠️ 新闻数据超过30分钟未更新，暂停开新仓', 'warn');
      await sendNotification('⚠️ 新闻数据失效', '超过30分钟未成功更新，暂停开新仓', '4', 'warning');
    }

    let positions;
    try {
      positions = await fetchPositions();
    } catch (e) {
      log(`获取持仓失败: ${e.message}`, 'sell');
      return;
    }

    const totalEquity = parseFloat(account.equity);
    const activePositions = [];

    for (const pos of positions) {
      const sym = pos.symbol;
      const entryPrice = parseFloat(pos.avg_entry_price);
      const currentPrice = parseFloat(pos.current_price);
      const qty = parseFloat(pos.qty);
      const marketValue = qty * currentPrice;
      const pnlPct = ((currentPrice - entryPrice) / entryPrice) * 100;

      log(`持仓 ${sym}: ${qty.toFixed(4)}股 | 均价$${entryPrice.toFixed(2)} → $${currentPrice.toFixed(2)} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)`, 'info');

      if (!positionHighPrice[sym] || currentPrice > positionHighPrice[sym]) {
        positionHighPrice[sym] = currentPrice;
      }
      const highPrice = positionHighPrice[sym];
      const trailingStop = highPrice * 0.98;
      const costStop = entryPrice * (1 - stopLossPct / 100);
      const effectiveStop = Math.max(trailingStop, costStop);
      const effectiveStopPct = ((effectiveStop - entryPrice) / entryPrice) * 100;

      if (pnlPct >= takeProfitPct) {
        log(`${sym} 止盈 (+${pnlPct.toFixed(2)}%)`, 'buy');
        try {
          await closePosition(sym);
          cleanupPositionState(sym, true);
          log(`${sym} 平仓成功 (止盈) | 今日第${dailyTradeCount[sym]}次`, 'buy');
          await sendNotification('💰 止盈平仓', `${sym} 盈利 ${pnlPct.toFixed(2)}%`, '4', 'money_bag');
        } catch (e) { log(`${sym} 平仓失败: ${e.message}`, 'sell'); }
        continue;
      }

      if (currentPrice <= effectiveStop) {
        log(`${sym} 止损 现价$${currentPrice.toFixed(2)} ≤ $${effectiveStop.toFixed(2)} (${effectiveStopPct.toFixed(2)}%)`, 'sell');
        try {
          await closePosition(sym);
          cleanupPositionState(sym, true);
          log(`${sym} 平仓成功 (止损) | 今日第${dailyTradeCount[sym]}次`, 'sell');
          await sendNotification('🛑 止损平仓', `${sym} 亏损 ${pnlPct.toFixed(2)}%`, '5', 'warning');
        } catch (e) { log(`${sym} 平仓失败: ${e.message}`, 'sell'); }
        continue;
      }

      const cachedNews = newsCache[sym] || { bullish: false, score: 0, source: 'none' };
      if (!cachedNews.bullish && cachedNews.score < 0.15 && pnlPct < 0.5) {
        log(`${sym} 反向信号平仓 (新闻来源: ${cachedNews.source})`, 'sell');
        try {
          await closePosition(sym);
          cleanupPositionState(sym, true);
          log(`${sym} 平仓成功 (反向信号) | 今日第${dailyTradeCount[sym]}次`, 'sell');
          await sendNotification('🔄 反向信号平仓', `${sym} 盈亏 ${pnlPct.toFixed(2)}%`, '3', 'arrows_counterclockwise');
        } catch (e) { log(`${sym} 平仓失败: ${e.message}`, 'sell'); }
        continue;
      }

      const posAdded = positionHighPrice[sym + '_added'];
      if (!posAdded && pnlPct >= addTriggerPct && dailyTradeCount[sym] < MAX_DAILY_TRADES_PER_SYMBOL) {
        const currentExposurePct = (marketValue / totalEquity) * 100;
        if (currentExposurePct < maxExposurePct) {
          const composite = cachedNews.score || 0;
          const addSize = composite >= COMPOSITE_HIGH_THRESHOLD ? addSizePct + 1 : addSizePct;
          const addValue = totalEquity * (addSize / 100);
          const newExposurePct = ((marketValue + addValue) / totalEquity) * 100;

          if (newExposurePct <= maxExposurePct) {
            const addQty = addValue / currentPrice;
            log(`${sym} 加仓 ${addSize}% (评分${composite.toFixed(2)}) 约${addQty.toFixed(4)}股`, 'buy');
            const result = await submitSplitOrder(sym, addQty, 'buy');
            if (result.success) {
              positionHighPrice[sym + '_added'] = true;
              positionHighPrice[sym] = currentPrice;
              await sendNotification('📈 加仓执行', `${sym} 加仓 $${addValue.toFixed(2)}`, '4', 'chart_increasing');
            }
          } else {
            log(`${sym} 加仓后市值将达${newExposurePct.toFixed(1)}% > ${maxExposurePct}%，跳过`, 'warn');
          }
        } else {
          log(`${sym} 市值${currentExposurePct.toFixed(1)}% ≥ ${maxExposurePct}%，禁止加仓`, 'warn');
        }
      }

      activePositions.push(pos);
    }

    const totalExposure = activePositions.reduce((sum, p) => sum + parseFloat(p.market_value), 0);
    const totalExposurePct = (totalExposure / totalEquity) * 100;
    document.getElementById('statCount').textContent = `${activePositions.length}/${maxPositions}`;
    document.getElementById('statExposure').textContent = totalExposurePct.toFixed(1) + '%';

    if (newsStale) {
      log('新闻数据失效，跳过入场评估', 'warn');
      updatePositionDisplay(activePositions);
      await updateOrdersDisplay();
      return;
    }

    if (activePositions.length >= maxPositions) {
      log(`持仓已达上限 ${activePositions.length}/${maxPositions}`, 'info');
      updatePositionDisplay(activePositions);
      await updateOrdersDisplay();
      return;
    }

    if (totalExposurePct >= maxTotalExposurePct) {
      log(`总敞口 ${totalExposurePct.toFixed(1)}% ≥ ${maxTotalExposurePct}%，不开新仓`, 'info');
      updatePositionDisplay(activePositions);
      await updateOrdersDisplay();
      return;
    }

    const heldSymbols = new Set(activePositions.map(p => p.symbol));
    const remainingSlots = maxPositions - activePositions.length;
    let runningExposure = totalExposure;

    const barsMap = await fetchLatestBars(symbols, timeframe);
    const candidates = [];

    for (const sym of symbols) {
      if (heldSymbols.has(sym)) { log(`${sym} 已持有，跳过`, 'info'); continue; }
      if ((dailyTradeCount[sym] || 0) >= MAX_DAILY_TRADES_PER_SYMBOL) { log(`${sym} 今日已达${MAX_DAILY_TRADES_PER_SYMBOL}次上限`, 'info'); continue; }
      const lastClose = lastCloseTime[sym];
      if (lastClose && lastClose > lastNewsFetchTime) { log(`${sym} 清仓后等待下次新闻更新`, 'info'); continue; }
      if (!isMarketOpen()) { log(`${sym} 非交易时段`, 'info'); continue; }

      const bars = barsMap[sym];
      if (!bars || bars.length < 4) continue;
      const latest = bars[bars.length - 1];
      const price = latest.close;

      const barRange = ((latest.high - latest.low) / latest.close) * 100;
      if (barRange > 1.0) { log(`${sym} K线振幅${barRange.toFixed(2)}% > 1%`, 'info'); continue; }

      if (bars.length >= 20) {
        let atrSum = 0;
        for (let j = bars.length - 20; j < bars.length; j++) {
          atrSum += ((bars[j].high - bars[j].low) / bars[j].close) * 100;
        }
        const atr = atrSum / 20;
        if (atr > atrThresholdPct) { log(`${sym} ATR ${atr.toFixed(2)}% > ${atrThresholdPct}%`, 'info'); continue; }
      }

      const pastPrice = bars[bars.length - 4].close;
      const momentumPct = ((price - pastPrice) / pastPrice) * 100;
      if (momentumPct < momentumThresholdPct) { log(`${sym} 动量${momentumPct.toFixed(2)}% < ${momentumThresholdPct}%`, 'info'); continue; }

      const cachedNews = newsCache[sym] || { bullish: false, score: 0, source: 'none' };
      if (!cachedNews.bullish || cachedNews.score <= 0.3) { log(`${sym} 新闻不够看涨(${cachedNews.score.toFixed(2)}) [${cachedNews.source}]`, 'info'); continue; }

      const momentumScore = Math.min(momentumPct / 5, 1);
      const composite = cachedNews.score * 0.6 + momentumScore * 0.4;

      candidates.push({ sym, price, composite, momentumPct, newsScore: cachedNews.score, newsSource: cachedNews.source, bars });
      log(`${sym} 候选: 综合分${composite.toFixed(3)} (情绪${cachedNews.score.toFixed(2)}, 动量${momentumPct.toFixed(2)}%) [${cachedNews.source}]`, 'info');
    }

    if (candidates.length === 0) {
      log('本轮无候选', 'info');
      updatePositionDisplay(activePositions);
      await updateOrdersDisplay();
      return;
    }

    candidates.sort((a, b) => b.composite - a.composite);
    const topThree = candidates.slice(0, 3);

    let opened = 0;
    for (const c of topThree) {
      if (opened >= remainingSlots) break;

      if (!checkUptrend(c.bars, timeframe)) {
        log(`${c.sym} 趋势确认不通过，尝试下一个`, 'warn');
        continue;
      }

      const positionValue = totalEquity * (baseSizePct / 100);
      if ((runningExposure + positionValue) / totalEquity * 100 > maxTotalExposurePct) {
        log(`${c.sym} 将超过${maxTotalExposurePct}%总敞口上限，跳过`, 'warn');
        continue;
      }

      const slippage = SLIPPAGE_MAP[c.sym] || 0.001;
      const effectivePrice = c.price * (1 + slippage);
      const qty = positionValue / effectivePrice;

      log(`>>> 买入 ${c.sym}: ${qty.toFixed(4)}股 @ ~$${effectivePrice.toFixed(2)} (综合分${c.composite.toFixed(3)})`, 'buy');
      const result = await submitSplitOrder(c.sym, qty, 'buy');
      if (result.success) {
        positionHighPrice[c.sym] = c.price;
        runningExposure += positionValue;
        opened++;
        await sendNotification(
          '🚀 买入信号',
          `${c.sym} 买入 ${qty.toFixed(4)}股 @ $${effectivePrice.toFixed(2)}\n` +
          `综合分${c.composite.toFixed(3)}（情绪${c.newsScore.toFixed(2)}, 动量${c.momentumPct.toFixed(2)}%）\n` +
          `仓位 $${positionValue.toFixed(2)}（${baseSizePct}%）`,
          '4', 'rocket'
        );
      } else {
        await sendNotification('⚠️ 买入失败', `${c.sym} 下单失败`, '4', 'warning');
      }
    }

    updatePositionDisplay(activePositions);
    await updateOrdersDisplay();

  } finally {
    isCycling = false;
  }
}

// ═══════════════════════════════════════════════
// 界面更新
// ═══════════════════════════════════════════════
function updatePositionDisplay(positions) {
  const el = document.getElementById('positionInfo');
  if (!positions || positions.length === 0) {
    el.innerHTML = '<span style="color:#8b949e;">暂无持仓</span>';
    return;
  }
  el.innerHTML = positions.map(p => {
    const entry = parseFloat(p.avg_entry_price);
    const current = parseFloat(p.current_price);
    const pnlPct = ((current - entry) / entry) * 100;
    const color = pnlPct >= 0 ? '#3fb950' : '#f85149';
    return `<div style="margin-bottom:6px;">
      <strong>${p.symbol}</strong>: ${parseFloat(p.qty).toFixed(4)}股 |
      均价$${entry.toFixed(2)} → $${current.toFixed(2)} |
      <span style="color:${color};">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</span>
    </div>`;
  }).join('');
}

async function updateOrdersDisplay() {
  try {
    const orders = await fetchRecentOrders();
    const el = document.getElementById('ordersList');
    el.innerHTML = (orders || []).slice(0, 8).map(o => {
      const sideColor = o.side === 'buy' ? '#3fb950' : '#f85149';
      return `<div style="padding:3px 0; border-bottom:1px solid #21262d;">
        <span style="color:${sideColor};">${o.side.toUpperCase()}</span>
        ${o.symbol} × ${parseFloat(o.qty).toFixed(4)} | ${o.status}
        | ${new Date(o.submitted_at).toLocaleTimeString('zh-CN', {hour12:false, timeZone:'America/New_York'})}
      </div>`;
    }).join('') || '<span style="color:#8b949e;">暂无订单</span>';
  } catch (e) { /* 静默 */ }
}

// ═══════════════════════════════════════════════
// 循环控制
// ═══════════════════════════════════════════════
function startLoop() {
  if (running) { log('已在运行中，忽略启动请求', 'warn'); return; }
  const intervalMin = parseInt(document.getElementById('interval').value);
  const intervalMs = intervalMin * 60 * 1000;

  running = true;
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';

  log(`实时交易已启动 | 交易检查${intervalMin}分钟 | 新闻动态10/12分钟`, 'buy');
  sendNotification('▶️ 策略已启动', `实时交易启动，检查间隔${intervalMin}分钟`, '3', 'arrow_forward');

  runOneCycle().catch(e => { console.error(e); log(`循环错误: ${e.message}`, 'sell'); });

  timerInterval = setInterval(() => {
    if (running) {
      runOneCycle().catch(e => { console.error(e); log(`循环错误: ${e.message}`, 'sell'); });
    }
  }, intervalMs);

  secondsUntilNext = intervalMin * 60;
  countdownInterval = setInterval(() => {
    if (!running) return;
    secondsUntilNext--;
    if (secondsUntilNext < 0) secondsUntilNext = intervalMs / 1000;
    const m = Math.floor(secondsUntilNext / 60);
    const s = secondsUntilNext % 60;
    document.getElementById('timerDisplay').textContent =
      `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }, 1000);
}

function stopLoop() {
  if (!running) { log('未在运行中，忽略停止请求', 'warn'); return; }
  running = false;
  clearInterval(timerInterval);
  clearInterval(countdownInterval);
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('timerDisplay').textContent = '--:--';
  log('实时交易已停止', 'warn');
  sendNotification('⏹️ 策略已停止', '实时交易已手动停止', '3', 'stop_sign');
}

// ═══════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnStart').addEventListener('click', startLoop);
  document.getElementById('btnStop').addEventListener('click', stopLoop);
  document.getElementById('btnReset').addEventListener('click', () => {
    document.getElementById('log').innerHTML = '';
  });

  // 自动启停检查：每 30 秒一次
  autoCheckInterval = setInterval(checkAutoStartStop, 30 * 1000);
  // 页面加载后立即检查一次
  checkAutoStartStop();

  log('面板就绪。自动启停已开启，默认美东 9:29 启动 / 16:02 停止。', 'info');
  log('注意：请确保 Alpaca 账户是 Paper Trading 模式。', 'warn');
  log(`手机通知已配置 | 主题: ${NTFY_TOPIC}`, 'info');
  log(`新闻源: APITube → Marketaux → Kiprio`, 'info');
  log(`多持仓模式：最多5只，单只≤10%，总≤75%`, 'info');
  log(`交易时段: 美东 9:30-16:00 | 高波动: 9:30-10:30, 15:00-16:00`, 'info');
});
