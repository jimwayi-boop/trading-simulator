<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新闻驱动动量策略模拟器</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; padding: 12px; }
  .container { display: grid; grid-template-columns: 320px 1fr 340px; gap: 12px; height: calc(100vh - 24px); }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; overflow-y: auto; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: #8b949e; margin-top: 10px; margin-bottom: 3px; }
  input, select { width: 100%; padding: 6px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 13px; }
  input:focus, select:focus { outline: none; border-color: #58a6ff; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { width: 100%; padding: 8px; margin-top: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-run { background: #238636; color: #fff; }
  .btn-run:hover { background: #2ea043; }
  .btn-reset { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-reset:hover { background: #30363d; }
  .chart-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  #chart { flex: 2; min-height: 0; }
  #equityChart { flex: 1; min-height: 0; border-top: 1px solid #30363d; }
  .log-entry { font-size: 12px; padding: 4px 6px; border-bottom: 1px solid #21262d; font-family: "SF Mono", monospace; }
  .buy { color: #3fb950; } .sell { color: #f85149; } .info { color: #8b949e; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .stat { background: #0d1117; border-radius: 6px; padding: 8px; }
  .stat-label { font-size: 11px; color: #8b949e; }
  .stat-value { font-size: 18px; font-weight: 600; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .badge-live { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
  .badge-sim { background: #d2992233; color: #d29922; border: 1px solid #d29922; }
  .badge-warn { background: #f8514933; color: #f85149; border: 1px solid #f85149; }
  .warning { font-size: 11px; color: #d29922; margin-top: 6px; line-height: 1.4; }
  .news-status { font-size: 11px; padding: 4px 6px; border-radius: 4px; margin-top: 6px; }
  .news-ok { background: #3fb95022; color: #3fb950; border: 1px solid #3fb95044; }
  .news-fallback { background: #d2992222; color: #d29922; border: 1px solid #d2992244; }
  .news-fail { background: #f8514922; color: #f85149; border: 1px solid #f8514944; }
</style>
</head>
<body>

<div class="container">

  <!-- 左面板: 策略配置 -->
  <div class="panel">
    <h3>策略配置</h3>

    <label>标的</label>
    <select id="symbol">
      <option value="TSLA">TSLA</option>
      <option value="AAPL" selected>AAPL</option>
      <option value="GOOGL">GOOGL</option>
      <option value="ASTS">ASTS</option>
    </select>

    <label>K线周期</label>
    <select id="timeframe">
      <option value="1">1分钟</option>
      <option value="5" selected>5分钟</option>
    </select>

    <div class="row">
      <div>
        <label>初始资金 ($)</label>
        <input type="number" id="capital" value="100000">
      </div>
      <div>
        <label>基础仓位 (%)</label>
        <input type="number" id="baseSize" value="5" step="0.5">
      </div>
    </div>

    <div class="row">
      <div>
        <label>止盈 (%)</label>
        <input type="number" id="takeProfit" value="2.5" step="0.1">
      </div>
      <div>
        <label>止损 (%)</label>
        <input type="number" id="stopLoss" value="1" step="0.1">
      </div>
    </div>

    <label>动量确认阈值 (价格爬升 %)</label>
    <input type="number" id="momentumThreshold" value="0.35" step="0.05">

    <label>加仓触发 (累计涨幅 %)</label>
    <input type="number" id="addPositionThreshold" value="5" step="0.5">

    <label>加仓比例 (%)</label>
    <input type="number" id="addPositionSize" value="10" step="0.5">

    <label>最大持仓占总资金 (%)</label>
    <input type="number" id="maxExposure" value="50" step="5">

    <label>数据源模式</label>
    <select id="dataMode">
      <option value="sim" selected>模拟数据 (内置生成)</option>
      <option value="alpaca">Alpaca IEX 实时</option>
    </select>

    <div id="newsStatus" class="news-status news-ok">新闻数据源: 待检查</div>
    <div id="newsDetail" style="font-size:10px; color:#8b949e; margin-top:4px;"></div>

    <button class="btn-run" id="btnRun">▶ 运行模拟</button>
    <button class="btn-reset" id="btnReset">重置</button>
  </div>

  <!-- 中面板: 图表 -->
  <div class="chart-wrap">
    <div id="chart"></div>
    <div id="equityChart"></div>
  </div>

  <!-- 右面板: 日志与统计 -->
  <div class="panel">
    <h3>绩效统计 <span id="modeBadge" class="badge badge-sim">模拟</span></h3>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">最终权益</div><div class="stat-value" id="statEquity">—</div></div>
      <div class="stat"><div class="stat-label">总收益率</div><div class="stat-value" id="statReturn">—</div></div>
      <div class="stat"><div class="stat-label">最大回撤</div><div class="stat-value" id="statDrawdown">—</div></div>
      <div class="stat"><div class="stat-label">胜率</div><div class="stat-value" id="statWinRate">—</div></div>
      <div class="stat"><div class="stat-label">交易次数</div><div class="stat-value" id="statTrades">—</div></div>
      <div class="stat"><div class="stat-label">新闻检查次数</div><div class="stat-value" id="statNewsChecks">—</div></div>
    </div>

    <h3 style="margin-top:16px;">交易日志</h3>
    <div id="log"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
// 配置: 你的 Cloudflare Worker 地址
// ═══════════════════════════════════════════════
const WORKER_URL = "https://trading-proxy.你的子域.workers.dev";  // ← 替换为你的 Worker 地址

// ═══════════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════════
const state = {
  data: [],
  signals: [],
  trades: [],
  equityCurve: [],
  capital: 100000,
  cash: 100000,
  maxEquity: 100000,
  maxDrawdown: 0,
  newsCheckCount: 0,
};

// ═══════════════════════════════════════════════
// 1. 模拟数据生成
// ═══════════════════════════════════════════════
function generateSimulatedData(symbol, tfMinutes, count = 500) {
  const basePrices = { TSLA: 250, AAPL: 220, GOOGL: 175, ASTS: 28 };
  let price = basePrices[symbol] || 100;
  const data = [];
  const now = Math.floor(Date.now() / 1000);
  const step = tfMinutes * 60;

  for (let i = count; i > 0; i--) {
    const time = now - i * step;
    const drift = (Math.random() - 0.48) * 0.004;
    const shock = (Math.random() - 0.5) * 0.012;
    const ret = drift + shock;

    const open = price;
    price = price * (1 + ret);
    const close = price;
    const high = Math.max(open, close) * (1 + Math.random() * 0.003);
    const low = Math.min(open, close) * (1 - Math.random() * 0.003);
    const volume = Math.floor(50000 + Math.random() * 200000);

    data.push({ time, open, high, low, close, volume });
  }
  return data;
}

// ═══════════════════════════════════════════════
// 2. 新闻情绪获取 (APITube 主 + Kiprio 备)
// ═══════════════════════════════════════════════

/**
 * 主方案: APITube
 * 每30分钟对每只标的检查一次
 */
async function fetchSentimentAPITube(symbol) {
  const url = `${WORKER_URL}/news/?organization.name=${symbol}&per_page=10&sort.by=sentiment.overall.score&sort.order=desc`;

  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`APITube ${resp.status}`);
  const json = await resp.json();

  const articles = json.results || [];
  if (articles.length === 0) return { bullish: false, score: 0, source: 'apitube' };

  let totalScore = 0;
  let count = 0;
  articles.forEach(a => {
    if (a.sentiment && a.sentiment.overall && a.sentiment.overall.score !== undefined) {
      totalScore += a.sentiment.overall.score;
      count++;
    }
  });

  const avgScore = count > 0 ? totalScore / count : 0;
  return {
    bullish: avgScore > 0.3,
    score: Math.abs(avgScore),
    source: 'apitube'
  };
}

/**
 * 备选方案: Kiprio
 * 把新闻标题发给 Kiprio 做情绪分析
 */
async function fetchSentimentKiprio(symbol) {
  const url = `${WORKER_URL}/kiprio/v1/sentiment`;

  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text: `${symbol} stock news recent price action`
    })
  });

  if (!resp.ok) throw new Error(`Kiprio ${resp.status}`);
  const json = await resp.json();

  const compound = json.compound || 0;
  return {
    bullish: compound > 0.2,
    score: Math.abs(compound),
    source: 'kiprio'
  };
}

/**
 * 带降级的新闻情绪获取
 * 优先 APITube, 失败或额度耗尽时自动切换到 Kiprio
 */
async function fetchNewsSentimentWithFallback(symbol) {
  state.newsCheckCount++;
  updateNewsStatus('checking', symbol);

  // 尝试 APITube
  try {
    const result = await fetchSentimentAPITube(symbol);
    updateNewsStatus('apitube', symbol, result);
    return result;
  } catch (e) {
    console.warn(`APITube 失败 (${symbol}):`, e.message);
    log(`APITube 失败，降级到 Kiprio: ${symbol}`, 'info');
  }

  // 降级到 Kiprio
  try {
    const result = await fetchSentimentKiprio(symbol);
    updateNewsStatus('kiprio', symbol, result);
    return result;
  } catch (e) {
    console.warn(`Kiprio 也失败 (${symbol}):`, e.message);
    updateNewsStatus('fail', symbol);
    return { bullish: false, score: 0, source: 'none' };
  }
}

function updateNewsStatus(status, symbol, result) {
  const el = document.getElementById('newsStatus');
  const detail = document.getElementById('newsDetail');

  if (status === 'checking') {
    el.className = 'news-status news-ok';
    el.textContent = `新闻检查中: ${symbol}...`;
  } else if (status === 'apitube') {
    el.className = 'news-status news-ok';
    el.textContent = `APITube 正常 | ${symbol}: ${result.bullish ? '看涨' : '中性'} (${result.score.toFixed(2)})`;
    detail.textContent = `已检查 ${state.newsCheckCount} 次 | 每30分钟轮询一次`;
  } else if (status === 'kiprio') {
    el.className = 'news-status news-fallback';
    el.textContent = `降级到 Kiprio | ${symbol}: ${result.bullish ? '看涨' : '中性'} (${result.score.toFixed(2)})`;
    detail.textContent = `APITube 额度可能耗尽，已自动切换备选源`;
  } else {
    el.className = 'news-status news-fail';
    el.textContent = `两个新闻源均失败 | ${symbol}`;
    detail.textContent = '请检查 Worker 中的 API Key 配置';
  }
}

// ═══════════════════════════════════════════════
// 3. 策略引擎
// ═══════════════════════════════════════════════
function runStrategy(data, newsResults, params) {
  const {
    capital, baseSizePct, takeProfitPct, stopLossPct,
    momentumThresholdPct, addPositionThresholdPct,
    addPositionSizePct, maxExposurePct
  } = params;

  let cash = capital;
  let position = null;
  const trades = [];
  const equityCurve = [];
  let maxEquity = capital;
  let maxDrawdown = 0;

  // newsResults: 每30分钟一个信号, 与K线的映射关系
  // 每30分钟 = 6根5分钟K线 或 30根1分钟K线
  const barsPerNewsCheck = params.timeframe === 5 ? 6 : 30;

  for (let i = 0; i < data.length; i++) {
    const bar = data[i];
    const price = bar.close;

    // 取当前时段对应的新闻信号
    const newsIdx = Math.floor(i / barsPerNewsCheck);
    const news = newsResults[newsIdx] || { bullish: false, score: 0 };

    // ── 持仓中: 检查出场 ──
    if (position) {
      const pnlPct = ((price - position.entryPrice) / position.entryPrice) * 100;

      if (pnlPct >= takeProfitPct) {
        cash += position.size * price;
        trades.push({
          ...position, exitPrice: price, exitTime: bar.time,
          pnlPct, pnl: position.size * (price - position.entryPrice), reason: '止盈'
        });
        position = null;
      } else if (pnlPct <= -stopLossPct) {
        cash += position.size * price;
        trades.push({
          ...position, exitPrice: price, exitTime: bar.time,
          pnlPct, pnl: position.size * (price - position.entryPrice), reason: '止损'
        });
        position = null;
      } else if (!news.bullish && news.score < 0.15 && pnlPct < 0.5) {
        cash += position.size * price;
        trades.push({
          ...position, exitPrice: price, exitTime: bar.time,
          pnlPct, pnl: position.size * (price - position.entryPrice), reason: '反向信号'
        });
        position = null;
      }
    }

    // ── 空仓中: 检查入场 ──
    if (!position && news.bullish && news.score > 0.3) {
      if (i >= 3) {
        const pastPrice = data[i - 3].close;
        const momentum = ((price - pastPrice) / pastPrice) * 100;

        if (momentum >= momentumThresholdPct) {
          const totalEquity = cash;
          const positionValue = totalEquity * (baseSizePct / 100);

          if ((positionValue / totalEquity) * 100 <= maxExposurePct) {
            const size = positionValue / price;
            cash -= positionValue;
            position = {
              entryPrice: price, size, entryTime: bar.time,
              symbol: params.symbol, added: false
            };
          }
        }
      }
    }

    // ── 加仓 ──
    if (position && !position.added) {
      const pnlPct = ((price - position.entryPrice) / position.entryPrice) * 100;
      if (pnlPct >= addPositionThresholdPct) {
        const totalEquity = cash + position.size * price;
        const addValue = totalEquity * (addPositionSizePct / 100);
        const newExposure = (position.size * price + addValue) / totalEquity * 100;

        if (newExposure <= maxExposurePct && cash >= addValue) {
          const addSize = addValue / price;
          const totalSize = position.size + addSize;
          position.entryPrice = (position.size * position.entryPrice + addValue) / totalSize;
          position.size = totalSize;
          position.added = true;
          cash -= addValue;
        }
      }
    }

    const equity = cash + (position ? position.size * price : 0);
    equityCurve.push({ time: bar.time, value: equity });
    if (equity > maxEquity) maxEquity = equity;
    const dd = ((maxEquity - equity) / maxEquity) * 100;
    if (dd > maxDrawdown) maxDrawdown = dd;
  }

  if (position) {
    const lastPrice = data[data.length - 1].close;
    cash += position.size * lastPrice;
    trades.push({
      ...position, exitPrice: lastPrice, exitTime: data[data.length - 1].time,
      pnlPct: ((lastPrice - position.entryPrice) / position.entryPrice) * 100,
      pnl: position.size * (lastPrice - position.entryPrice), reason: '期末平仓'
    });
  }

  return { trades, equityCurve, finalEquity: cash, maxDrawdown };
}

// ═══════════════════════════════════════════════
// 4. 图表
// ═══════════════════════════════════════════════
let mainChart, candleSeries, equityChart, equitySeries;

function initCharts() {
  const chartEl = document.getElementById('chart');
  const eqEl = document.getElementById('equityChart');

  mainChart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    timeScale: { timeVisible: true, secondsVisible: false },
  });
  candleSeries = mainChart.addCandlestickSeries({
    upColor: '#3fb950', downColor: '#f85149',
    borderUpColor: '#3fb950', borderDownColor: '#f85149',
    wickUpColor: '#3fb950', wickDownColor: '#f85149',
  });

  equityChart = LightweightCharts.createChart(eqEl, {
    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    timeScale: { timeVisible: true },
  });
  equitySeries = equityChart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });

  const ro = new ResizeObserver(() => {
    mainChart.applyOptions({ width: chartEl.clientWidth, height: chartEl.clientHeight });
    equityChart.applyOptions({ width: eqEl.clientWidth, height: eqEl.clientHeight });
  });
  ro.observe(chartEl); ro.observe(eqEl);
}

function renderCharts(data, trades, equityCurve) {
  candleSeries.setData(data);
  equitySeries.setData(equityCurve);

  const markers = [];
  trades.forEach(t => {
    markers.push({ time: t.entryTime, position: 'belowBar', color: '#3fb950', shape: 'arrowUp', text: `买 ${t.size.toFixed(1)}股` });
    markers.push({ time: t.exitTime, position: 'aboveBar', color: '#f85149', shape: 'arrowDown', text: `${t.reason} ${t.pnlPct.toFixed(1)}%` });
  });
  candleSeries.setMarkers(markers);
  mainChart.timeScale().fitContent();
  equityChart.timeScale().fitContent();
}

// ═══════════════════════════════════════════════
// 5. UI
// ═══════════════════════════════════════════════
function getParams() {
  return {
    symbol: document.getElementById('symbol').value,
    timeframe: parseInt(document.getElementById('timeframe').value),
    capital: parseFloat(document.getElementById('capital').value),
    baseSizePct: parseFloat(document.getElementById('baseSize').value),
    takeProfitPct: parseFloat(document.getElementById('takeProfit').value),
    stopLossPct: parseFloat(document.getElementById('stopLoss').value),
    momentumThresholdPct: parseFloat(document.getElementById('momentumThreshold').value),
    addPositionThresholdPct: parseFloat(document.getElementById('addPositionThreshold').value),
    addPositionSizePct: parseFloat(document.getElementById('addPositionSize').value),
    maxExposurePct: parseFloat(document.getElementById('maxExposure').value),
  };
}

function log(msg, cls = 'info') {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = `log-entry ${cls}`;
  div.textContent = msg;
  el.prepend(div);
  if (el.children.length > 200) el.removeChild(el.lastChild);
}

function updateStats(result, params) {
  const totalReturn = ((result.finalEquity - params.capital) / params.capital) * 100;
  const wins = result.trades.filter(t => t.pnl > 0).length;
  const winRate = result.trades.length ? (wins / result.trades.length) * 100 : 0;

  document.getElementById('statEquity').textContent = '$' + result.finalEquity.toFixed(0);
  document.getElementById('statReturn').textContent = totalReturn.toFixed(2) + '%';
  document.getElementById('statDrawdown').textContent = result.maxDrawdown.toFixed(2) + '%';
  document.getElementById('statWinRate').textContent = winRate.toFixed(1) + '%';
  document.getElementById('statTrades').textContent = result.trades.length;
  document.getElementById('statNewsChecks').textContent = state.newsCheckCount;
}

// ═══════════════════════════════════════════════
// 6. 主运行逻辑
// ═══════════════════════════════════════════════
async function runSimulation() {
  const params = getParams();
  const mode = document.getElementById('dataMode').value;

  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnRun').textContent = '运行中...';
  document.getElementById('log').innerHTML = '';
  state.newsCheckCount = 0;

  let data;

  try {
    if (mode === 'sim') {
      document.getElementById('modeBadge').textContent = '模拟';
      document.getElementById('modeBadge').className = 'badge badge-sim';
      data = generateSimulatedData(params.symbol, params.timeframe, 500);
      log(`[模拟] 生成 ${data.length} 根 ${params.timeframe}分钟 K线`, 'info');
    } else if (mode === 'alpaca') {
      document.getElementById('modeBadge').textContent = 'Alpaca IEX';
      document.getElementById('modeBadge').className = 'badge badge-live';
      data = await fetchAlpacaBars(params.symbol, params.timeframe);
      log(`[Alpaca] 获取 ${data.length} 根K线 (IEX feed)`, 'info');
    }

    // 计算需要多少次新闻检查
    const barsPerNewsCheck = params.timeframe === 5 ? 6 : 30;
    const totalNewsChecks = Math.ceil(data.length / barsPerNewsCheck);

    log(`共需 ${totalNewsChecks} 次新闻检查 (每30分钟一次)`, 'info');

    // 获取新闻信号
    const newsResults = [];
    for (let i = 0; i < totalNewsChecks; i++) {
      const result = await fetchNewsSentimentWithFallback(params.symbol);
      newsResults.push(result);

      // 避免触发速率限制: 每次请求后等待6秒
      if (i < totalNewsChecks - 1) {
        await new Promise(r => setTimeout(r, 6000));
      }
    }

    const result = runStrategy(data, newsResults, params);
    renderCharts(data, result.trades, result.equityCurve);
    updateStats(result, params);

    result.trades.slice(-20).reverse().forEach(t => {
      log(
        `${new Date(t.entryTime * 1000).toLocaleString()} ${t.reason} ` +
        `$${t.entryPrice.toFixed(2)} → $${t.exitPrice.toFixed(2)} ` +
        `P&L: ${t.pnlPct.toFixed(2)}% ($${t.pnl.toFixed(0)})`,
        t.pnl > 0 ? 'buy' : 'sell'
      );
    });

  } catch (e) {
    log('错误: ' + e.message, 'sell');
    console.error(e);
  } finally {
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnRun').textContent = '▶ 运行模拟';
  }
}

async function fetchAlpacaBars(symbol, tfMinutes) {
  const tfMap = { 1: '1Min', 5: '5Min' };
  const url = `${WORKER_URL}/alpaca/v2/stocks/${symbol}/bars?timeframe=${tfMap[tfMinutes]}&limit=500&feed=iex&sort=asc`;

  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`行情 API ${resp.status}`);
  const json = await resp.json();
  return (json.bars || []).map(b => ({
    time: Math.floor(new Date(b.t).getTime() / 1000),
    open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v
  }));
}
